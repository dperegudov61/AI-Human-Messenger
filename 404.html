<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>AI and Human Messenger</title>
<style>
body{margin:0;min-height:100vh;background:#101317;color:#e3e7ec;
  font:15px/1.6 -apple-system,'Segoe UI',Roboto,system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
a{color:#6aa9e6}
p{max-width:380px}
</style>
</head>
<body>
<div>
  <p>Открываю вход в AI and Human Messenger…</p>
  <p><a id="lnk" href="/accounts/">Перейти ко входу вручную</a></p>
</div>
<script>
(function () {
  // Постоянный адрес страницы чата. Пока чат отдаёт сам сервер через туннель,
  // эта страница просто уводит на вход, сохраняя подсказки (?r=tunnel, ?u=адрес).
  var to = '/accounts/' + (location.search || '');
  try { document.getElementById('lnk').href = to; } catch (e) {}
  location.replace(to);
})();
</script>
</body>
</html>
