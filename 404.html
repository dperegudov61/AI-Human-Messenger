<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#111417">
<script src="theme.js" data-i18n="strings.tsv"></script>
<title data-i18n="chat.title">AI &amp; Human · chat</title>
<style>
/* ---------- палитра: тёмная (по умолчанию) и светлая ----------
   Все цвета страницы берутся только отсюда; тему переключает атрибут
   data-theme на <html> (его ставит theme.js рядом с этим файлом).
   Значения подобраны парами: один смысл — один уровень темноты. */
:root{
  color-scheme:dark;
  --bg:#111417; --side:#161a1f; --card:#171c22; --area:#1a2129;
  --raise:#1d242c; --raise2:#26303a; --input:#1b2027;
  --sel:#223040; --sel2:#25384f; --selTx:#fff;
  --line:#262c34; --line2:#303a46; --line3:#33506e;
  --tx:#e6e9ee; --tx2:#b9c4d0; --tx3:#8b949e; --tx4:#7c8794;
  --acc:#2f6fb5; --acc2:#3f81c9; --accTx:#fff;
  --lnk:#6aa9e6; --dot:#4a5260; --ok:#4dbf74; --okTx:#9ee2b4;
  --bad:#b4453c; --badTx:#ffb4b4; --badBg:#3a2020; --badBg2:#2a1c1e;
  --warnBg:#4a3a12; --warnTx:#ffe6ad; --warnLine:#6b5520; --warnBtn:#2b2415;
  --busy:#5a4a22; --bubbleU:#2b5f96; --bubbleUTx:#f2f7ff; --bubbleA:#1c2229;
  --whoTx:#8fb8e0; --toast:#232b35; --dim:#0009;
  --overlay:rgba(11,14,18,.8); --overlay2:rgba(14,17,20,.93); --mtc:#111417;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f6f9; --side:#eef1f6; --card:#ffffff; --area:#eff3f8;
  --raise:#e7ebf2; --raise2:#dfe5ee; --input:#ffffff;
  --sel:#dbe8fa; --sel2:#c9dcf6; --selTx:#0d2c4f;
  --line:#dfe4ec; --line2:#d3dae4; --line3:#a6c4e4;
  --tx:#161c24; --tx2:#3f4a57; --tx3:#5b6672; --tx4:#6f7b88;
  --acc:#2f6fb5; --acc2:#2c68ab; --accTx:#fff;
  --lnk:#1a6cbb; --dot:#98a3b0; --ok:#17a35c; --okTx:#157347;
  --bad:#c62828; --badTx:#b3261e; --badBg:#fdeceb; --badBg2:#fbe3e1;
  --warnBg:#fdf2d6; --warnTx:#7a5a00; --warnLine:#e3c98f; --warnBtn:#f6e6bd;
  --busy:#f0dfb0; --bubbleU:#d7e6fb; --bubbleUTx:#12304f; --bubbleA:#ffffff;
  --whoTx:#2a5b8f; --toast:#e9eef5; --dim:rgba(20,28,38,.35);
  --overlay:rgba(20,28,38,.42); --overlay2:rgba(244,247,252,.97); --mtc:#f4f6f9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font:15px/1.45 -apple-system,'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100dvh}
button,input,textarea,select{font:inherit}
a{color:var(--lnk)}
#side{width:272px;flex:0 0 272px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side.hide{display:none}
.brand{padding:12px 14px 8px;font-weight:600;letter-spacing:.2px}
.brand small{display:block;font-weight:400;color:var(--tx4);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
#net{display:flex;align-items:center;gap:7px;padding:2px 14px 10px;color:var(--tx3);font-size:12px}
#net .dot{width:8px;height:8px;border-radius:50%;background:var(--dot);flex:0 0 auto}
#net .dot.on{background:var(--ok)}

/* выпадающие разделы */
.acc{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line)}
.acc:first-of-type{border-top:0}
.acc .hd{display:flex;align-items:center;gap:7px;padding:9px 12px 7px;color:var(--tx4);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;user-select:none;min-height:38px}
.acc .hd:hover{color:var(--tx2)}
.acc .hd .tw{display:inline-block;width:12px;transition:transform .15s;color:var(--tx4)}
.acc.closed .hd .tw{transform:rotate(-90deg)}
.acc .hd .nm{flex:1}
.acc .hd button{background:var(--raise);border:1px solid var(--line2);color:var(--tx2);border-radius:8px;width:26px;height:26px;line-height:1;cursor:pointer;font-size:16px;padding:0}
.acc .hd button:hover{background:var(--raise2);color:var(--tx)}
.acc .bd{overflow-y:auto;padding:0 8px 8px;min-height:0}
.acc.closed .bd{display:none}
#aiAcc .bd{max-height:44vh}
#pmAcc .bd{flex:1 1 auto;max-height:none}

.it{display:flex;gap:8px;align-items:center;padding:8px 8px;border-radius:9px;cursor:pointer;color:var(--tx);position:relative}
.it:hover{background:var(--raise)}
.it.on{background:var(--sel);outline:1px solid var(--line3)}
.it .ic{width:20px;text-align:center;flex:0 0 20px;color:var(--tx3)}
.it .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .sub{color:var(--tx4);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .dot{width:7px;height:7px;border-radius:50%;background:var(--dot);flex:0 0 auto}
.it .dot.on{background:var(--ok)}
.it .del{display:none;background:none;border:0;color:var(--tx4);font-size:15px;padding:2px 4px;border-radius:6px;cursor:pointer;flex:0 0 auto}
.it:hover .del{display:block}
.it .del:hover{color:var(--badTx);background:var(--badBg2)}
@media (hover:none){ .it .del{display:block;color:var(--tx4)} }

#me{margin-top:auto;border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--tx3);font-size:13px;min-height:52px}
#me .ui-sw{flex:1 1 100%}
#me .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#me button{background:var(--raise);border:1px solid var(--line2);color:var(--tx3);border-radius:8px;padding:4px 8px;cursor:pointer;font-size:12px}
#actb{display:none;align-items:center;gap:8px;padding:6px 10px;background:var(--warnBg);color:var(--warnTx);font-size:12.5px;border-bottom:1px solid var(--warnLine)}
#actb.on{display:flex}
#actb span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#actb button{background:var(--warnBtn);border:1px solid var(--warnLine);color:var(--warnTx);border-radius:8px;padding:3px 9px;cursor:pointer;white-space:nowrap}

main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--side);min-height:52px}
#menu{display:none;background:none;border:0;color:var(--tx2);font-size:20px;cursor:pointer;padding:0 4px}
#title{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hint{color:var(--tx4);font-size:12px}
#cfg{background:var(--raise);border:1px solid var(--line2);color:var(--tx2);border-radius:9px;padding:5px 9px;cursor:pointer;font-size:15px;line-height:1}
#cfg:disabled{opacity:.35;cursor:default}

#log{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:8px;min-height:0;overscroll-behavior:contain}
.m{max-width:min(640px,86%);padding:8px 11px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--bubbleU);color:var(--bubbleUTx);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--bubbleA);color:var(--tx);border-bottom-left-radius:4px}
.m.th{align-self:flex-start;background:var(--area);color:var(--tx2);font-size:13.5px}
.m.pend{opacity:.5}
.m.err{box-shadow:0 0 0 1px var(--bad) inset;cursor:pointer}
.m.e{align-self:flex-start;background:var(--badBg);color:var(--badTx);font-size:13.5px}
.m .who{font-size:11.5px;color:var(--whoTx);margin-bottom:3px}
.m .tm{font-size:10.5px;color:var(--tx4);margin-left:6px}
.m img{max-width:100%;border-radius:8px;display:block;margin-top:6px;cursor:zoom-in;background:var(--bg);min-height:40px}
.m .mimg{position:relative}
.m .shr{position:absolute;right:6px;top:6px;background:rgba(12,16,20,.72);color:#cfe3ff;border:0;border-radius:8px;padding:3px 7px;font-size:12px;cursor:pointer}
.m .dl{position:absolute;right:6px;bottom:6px;background:rgba(12,16,20,.72);color:#cfe3ff;border-radius:8px;padding:3px 8px;font-size:13px;text-decoration:none}
.m .dl:hover,.m .shr:hover{background:rgba(40,80,140,.9)}
.m.gone{align-self:center;background:transparent;color:var(--tx4);font-size:12.5px;font-style:italic;padding:2px 8px}
.m .fwait{font-size:11.5px;color:var(--tx3);margin-top:4px}
.m .fwait:empty{display:none}
#typing{display:none;padding:2px 14px 6px;color:var(--tx3);font-size:12.5px}
#typing.on{display:block}
#form{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--side)}
#clip{flex:0 0 auto;width:42px;height:40px;border-radius:10px;background:var(--raise);border:1px solid var(--line2);color:var(--tx3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:19px}
#text{flex:1;min-height:40px;max-height:40vh;resize:none;background:var(--input);color:var(--tx);border:1px solid var(--line);border-radius:11px;padding:9px 11px;outline:none;font-size:16px}
#send{flex:0 0 auto;width:44px;height:40px;border-radius:10px;border:0;background:var(--acc);color:var(--accTx);font-size:17px;cursor:pointer}
#send:disabled{opacity:.45}
#send.busy{background:var(--busy)}

/* модальные окна: снизу на телефоне, по центру на ПК */
#modal{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-end;justify-content:center;z-index:25}
#modal.on{display:flex}
#modal .sheet{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:760px){ #modal{align-items:center} #modal .sheet{border-radius:16px} }
#modal h3{margin:0 0 4px;font-size:16px}
#modal p.h{margin:0 0 12px;color:var(--tx3);font-size:12.5px}
.mlist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto}
.mi{display:flex;gap:9px;align-items:center;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--area);cursor:pointer}
.mi:hover{background:var(--raise)}
.mi.on{outline:1px solid var(--line3);background:var(--sel)}
.mi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .t small{display:block;color:var(--tx4);font-size:11.5px}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1}
.btn{background:var(--raise);border:1px solid var(--line2);color:var(--tx);border-radius:10px;padding:11px 14px;cursor:pointer;min-height:44px}
.btn.prim{background:var(--acc);border-color:var(--acc2);color:var(--accTx)}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 4px}
.chip{background:var(--area);border:1px solid var(--line2);color:var(--tx2);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--sel2);border-color:var(--line3);color:var(--selTx)}
.fld{margin:10px 0 2px}
.fld label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx3);margin-bottom:4px}
.fld label b{color:var(--tx);font-variant-numeric:tabular-nums}
.fld input[type=range]{width:100%;accent-color:var(--acc);height:30px}
.fld .ends{display:flex;justify-content:space-between;color:var(--tx4);font-size:11px;margin-top:-4px}
#sv{color:var(--tx3);font-size:12.5px;margin-top:10px;min-height:18px}
#sv.bad{color:var(--badTx)}
#sv.good{color:var(--okTx)}

#login{position:fixed;inset:0;background:var(--overlay2);display:none;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:30}
#login.on{display:flex}
#login .box{max-width:420px}
#login h1{font-size:19px;margin:0 0 8px}
#login p{color:var(--tx3);margin:0 0 16px;font-size:14px}
#login a.btn{display:inline-block;background:var(--acc);color:var(--accTx);text-decoration:none;padding:11px 18px;border-radius:10px;font-weight:600}
#login .retry{display:block;margin:14px auto 0;background:none;border:0;color:var(--tx4);cursor:pointer;font-size:13px;text-decoration:underline}

#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--toast);border:1px solid var(--line2);color:var(--tx);border-radius:10px;padding:9px 14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:40;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  #side{position:fixed;inset:0 auto 0 0;z-index:20;box-shadow:0 0 0 100vmax var(--dim)}
  #side.hide{display:none}
  #menu{display:block}
  #hint{display:none}
}
</style>
</head>
<body>

<aside id="side">
  <div class="brand">AI &amp; Human<small data-i18n="chat.brand.sub">messenger</small></div>
  <div id="net"><span class="dot" id="ndot"></span><span id="ntext" data-i18n="chat.net.searching">looking for server…</span></div>

  <div class="acc" id="aiAcc">
    <div class="hd"><span class="tw">▾</span><span class="nm" data-i18n="chat.ai.chats">AI chats</span><button type="button" id="newAI" title="new chat with a bot" data-i18n-title="chat.ai.new.title">＋</button></div>
    <div class="bd" id="aiList"></div>
  </div>

  <div class="acc" id="pmAcc">
    <div class="hd"><span class="tw">▾</span><span class="nm" data-i18n="chat.people">People</span><button type="button" id="newPM" title="new dialog with a person" data-i18n-title="chat.people.new.title">＋</button></div>
    <div class="bd" id="pmList"></div>
  </div>

  <div id="me"><span class="nm" id="mename">…</span><button id="acct" type="button" data-i18n="chat.account">account</button>
    <span class="ui-sw" data-ui="switch"></span></div>
</aside>

<main>
  <div id="actb"><span id="actt"></span><button type="button" id="actback" data-i18n="chat.act.back">back to myself</button></div>
  <header>
    <button id="menu" type="button" aria-label="menu" data-i18n-aria="chat.menu">☰</button>
    <div id="title" data-i18n="chat.pick.chat">pick a conversation</div>
    <div id="hint"></div>
    <button id="cfg" type="button" aria-label="bot settings" data-i18n-aria="chat.cfg.title" title="bot settings" data-i18n-title="chat.cfg.title" disabled>⚙</button>
  </header>
  <div id="log"></div>
  <div id="typing" data-i18n="chat.typing">AI is thinking…</div>
  <form id="form" autocomplete="off">
    <label id="clip" title="Attach a picture" data-i18n-title="chat.attach">＋<input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label>
    <textarea id="text" rows="1" placeholder="Message…" data-i18n-ph="chat.ph.message"></textarea>
    <button id="send" type="submit" aria-label="send" data-i18n-aria="chat.send">➤</button>
  </form>
</main>

<div id="login"><div class="box">
  <h1 id="lht" data-i18n="chat.login.need">Sign in needed</h1>
  <p id="lmsg" data-i18n="chat.login.sub">The chat page lives on GitHub, the conversation lives on your home PC.</p>
  <a class="btn" id="lgo" href="/accounts/" data-i18n="chat.login.go">Sign in</a>
  <button class="retry" id="lretry" type="button" data-i18n="chat.login.retry">Check the connection again</button>
</div></div>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
(function () {
'use strict';

// ---------- постоянные адреса ----------
var REPO  = 'dperegudov61/dperegudov61.github.io';
var API   = 'https://api.github.com/repos/' + REPO + '/contents/status.json';
var RAW   = 'https://raw.githubusercontent.com/' + REPO + '/main/status.json';
var LOCAL = 'https://dperegudov61.github.io/status.json';
var GH    = 'https://dperegudov61.github.io';
var PAGEURL = location.origin + location.pathname;
var TOK   = 'door.token';
var URLKEY = 'door.url';
var STALE_MIN = 60;

var $ = function (id) { return document.getElementById(id); };
var base = '', tok = '', me = '', realMe = '', actName = '', admin = false;
var dialogs = [], people = [], models = [], cur = null, curData = null;
var busy = false, lastCount = -1, bootT = 0;

function ls(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lss(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsd(k) { try { localStorage.removeItem(k); } catch (e) {} }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
  return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]; }); }

var toastT = 0;
function toast(text) {
  var el = $('toast');
  el.textContent = text;
  el.className = 'on';
  clearTimeout(toastT);
  toastT = setTimeout(function () { el.className = ''; }, 2600);
}

// ---------- сеть ----------
function timeout(ms) {
  var ctl = new AbortController();
  var t = setTimeout(function () { ctl.abort(); }, ms);
  return { signal: ctl.signal, done: function () { clearTimeout(t); } };
}
function fetchJSON(url, opt, ms) {
  var tm = timeout(ms || 8000);
  return fetch(url, Object.assign({ cache: 'no-store', signal: tm.signal }, opt || {}))
    .then(function (r) {
      tm.done();
      return r.text().then(function (txt) {
        var j = {};
        try { j = JSON.parse(txt || '{}'); } catch (e) {}
        return { status: r.status, ok: r.ok, json: j };
      });
    })
    .catch(function () { tm.done(); return { status: 0, ok: false, json: {} }; });
}
function api(path, opt) {
  opt = opt || {};
  var h = Object.assign({ 'Authorization': 'Bearer ' + tok }, opt.headers || {});
  return fetchJSON(base + path, { method: opt.method || 'GET', headers: h, body: opt.body }, opt.ms || 20000);
}
function post(path, obj, ms) {
  return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(obj || {}), ms: ms || 20000 });
}

// ---------- кэш в браузере (IndexedDB) ----------
// У каждого объекта свой id: чат, сообщение, файл. Клиент хранит их локально,
// при входе сразу показывает, а потом сверяет списки id с сервером через
// POST /__sync и /__chats/sync. Чего нет на сервере — выбрасываем; на месте
// удалённого сообщения остаётся пометка «сообщение удалено».
// У записи две даты: mt — когда менялась, at — когда её смотрели (для чистки).
var CACHE_DB = 'msgcache', CACHE_KEEP_DAYS = 30, CACHE_FILE_DAYS = 60;
var LAST_CHAT = 'chat.last', PRUNE_KEY = 'cache.prune';
var dbP = null, db = null, dbOk = false;
var fileUrls = {}, dlQueue = [], dlActive = {}, DL_MAX = 2;
var localPos = 0;

function nowMs() { return Date.now(); }

function cacheOpen() {
  if (dbP) return dbP;
  dbP = new Promise(function (resolve) {
    if (!window.indexedDB) { resolve(null); return; }
    var r = indexedDB.open(CACHE_DB, 1);
    r.onupgradeneeded = function (ev) {
      var d = ev.target.result;
      if (!d.objectStoreNames.contains('chats')) d.createObjectStore('chats', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('msgs')) {
        var s = d.createObjectStore('msgs', { keyPath: 'k' });
        s.createIndex('chat', 'chat', { unique: false });
        s.createIndex('image', 'image', { unique: false });
      }
      if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('chunks')) {
        var c = d.createObjectStore('chunks', { keyPath: 'k' });
        c.createIndex('file', 'file', { unique: false });
      }
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'k' });
    };
    r.onsuccess = function () { db = r.result; dbOk = !!db; resolve(db); };
    r.onerror = function () { dbOk = false; resolve(null); };
  });
  return dbP;
}
function cReq(req) {
  return new Promise(function (res, rej) {
    req.onsuccess = function () { res(req.result); };
    req.onerror = function () { rej(req.error); };
  });
}
function cDone(tx) {
  return new Promise(function (res, rej) {
    tx.oncomplete = function () { res(true); };
    tx.onerror = function () { rej(tx.error); };
    tx.onabort = function () { try { rej(tx.error); } catch (e) { rej(null); } };
  });
}
function cPut(store, val) {

    tx.objectStore(store).put(val);
    return cDone(tx);
  }).catch(function () { return 0; });
}
function cGet(store, key) {

    return cReq(d.transaction(store, 'readonly').objectStore(store).get(key));
  }).catch(function () { return null; });
}

// ---------- записи ----------
function msgKey(chatId, mid) { return chatId + '|' + mid; }
function msgRec(chatId, m, pos) {
  var t = nowMs();
  return {
    k: msgKey(chatId, m.id), chat: chatId, id: m.id, pos: (typeof pos === 'number' ? pos : 0),
    role: m.role || 'user', content: m.content || '', author: m.author || '',
    image: m.image || '', link: m.link || '', created: m.created || '',
    del: m.deleted ? 1 : 0, perm: 1, state: 'sent', mt: t, at: t

}
function recMsg(r) {

    image: r.image, link: r.link, deleted: !!r.del, state: r.state || 'sent' };
}
function chatRec(d) {
  var t = nowMs();
  return { id: d.id, title: d.title || '', kind: d.kind || '', peer: d.peer || '',
    model: d.model || '', shared: !!d.shared, count: d.count || 0,
    updated: d.updated || '', mt: t, at: t };
}
function chatOut(c) {
  return { id: c.id, title: c.title, kind: c.kind, peer: c.peer, model: c.model,
    shared: !!c.shared, count: c.count || 0, updated: c.updated || '' };
}

// ---------- чтение кэша ----------
function cacheMsgs(chatId) { return cByIndex('msgs', 'chat', chatId); }

function cacheTouch(chatId) {
  return cGet('chats', chatId).then(function (c) {
    if (!c) return;
    c.at = nowMs();
    return cPut('chats', c);
  });
}

// мгновенное открытие: что уже лежит в браузере — показываем до сети
function cacheBoot() {
  return cAll('chats').then(function (list) {
    if (dialogs.length || !list.length) return;
    list.sort(function (a, b) { return String(b.updated || '').localeCompare(String(a.updated || '')); });
    dialogs = list.map(chatOut);
    if (!cur) {
      var want = null, last = ls(LAST_CHAT);
      if (last) { for (var i = 0; i < dialogs.length; i++) if (dialogs[i].id === last) want = dialogs[i]; }
      if (!want) want = pickStart();
      if (want) open(want);
    }
    renderAll();
  });
}

// открытый чат: сначала из кэша, затем сверка по id
function cacheRenderChat(chatId, keepScroll) {
  if (!dbOk) {
    // нет IndexedDB (редкий случай): рисуем то, что пришло от сервера
    if (cur && cur.id === chatId && curData && curData.messages) drawMessages(curData.messages, keepScroll);
    return Promise.resolve();
  }
  return cacheMsgs(chatId).then(function (list) {
    if (!cur || cur.id !== chatId) return;
    list.sort(function (a, b) { return (a.pos || 0) - (b.pos || 0); });
    var msgs = list.map(recMsg);
    if (curData) curData.messages = msgs;
    lastCount = list.length;
    if (localPos < lastCount) localPos = lastCount;
    drawMessages(msgs, keepScroll);
    for (var i = 0; i < list.length; i++) {
      var fid = list[i].image;
      if (!fid || list[i].del) continue;
      prepFile(fid);
    }
  });
}

function prepFile(fid) {
  if (fileUrls[fid]) { updateImages(fid); return; }
  cGet('files', fid).then(function (f) {
    if (f && f.perm) ensureFile(f);
  });
}

// ---------- сверка с сервером ----------
var syncBusy = {}, syncAgain = {};
function syncChat(chatId) {
  if (!chatId || !base || !tok) return Promise.resolve();
  if (syncBusy[chatId]) { syncAgain[chatId] = true; return Promise.resolve(); }
  syncBusy[chatId] = true;
  return cacheMsgs(chatId).then(function (local) {
    var have = [], seen = {};
    local.forEach(function (r) { if (r.id && !seen[r.id]) { seen[r.id] = 1; have.push(r.id); } });
    var fids = [];
    local.forEach(function (r) { if (r.image && fids.indexOf(r.image) < 0) fids.push(r.image); });
    return Promise.all(fids.map(function (fid) { return cGet('files', fid); })).then(function (frecs) {
      var files = frecs.filter(Boolean).map(function (f) { return { id: f.id, done: f.state === 'done' }; });
      return post('/__sync', { id: chatId, have: have, files: files }, 25000);
    });
  }).then(function (r) {
    syncBusy[chatId] = false;
    var j = (r && r.json) || {};
    if (!r || !r.ok || !j.id) {
      if (r && (r.status === 403 || r.status === 404)) toast(j.error || t("chat.err.noview", "no access to this conversation"));
      return;
    }
    return applySync(chatId, j);
  }).then(function () {
    if (syncAgain[chatId]) {
      syncAgain[chatId] = false;
      if (cur && cur.id === chatId) return syncChat(chatId);
    }
  }).catch(function () { syncBusy[chatId] = false; });
}

function applySync(chatId, j) {
  var ids = j.ids || [], index = {};
  ids.forEach(function (mid, i) { index[mid] = i; });
  if (j.chat) {
    if (cur && cur.id === chatId) curData = j.chat;
    for (var i = 0; i < dialogs.length; i++) {
      if (dialogs[i].id !== chatId) continue;
      dialogs[i].title = j.chat.title || dialogs[i].title;
      dialogs[i].count = j.count || 0;
      dialogs[i].updated = j.chat.updated || dialogs[i].updated;
      renderAll();
      break;
    }
  }
  if (!dbOk) {
    // без кэша — просто список с сервера (have всегда пуст)
    if (j.chat) {
      j.chat.messages = (j.msgs || []).map(function (m) { return recMsg(msgRec(chatId, m, 0)); });
      if (cur && cur.id === chatId) { curData = j.chat; drawMessages(j.chat.messages, true); }
    }
    return;
  }
  var dels = j.del || [];
  return cacheMsgs(chatId).then(function (local) {
    var byId = {}, ops = [];
    local.forEach(function (r) { byId[r.id] = r; });
    // 1) у клиента есть, у сервера нет — объекта больше не существует
    local.forEach(function (r) {
      if (index.hasOwnProperty(r.id)) return;
      if (r.del) return;
      // своё ещё не подтверждённое сообщение сервер мог просто не получить — не съедаем
      if (r.state === 'sending' || r.state === 'error') return;
      r.del = 1; r.perm = 0; r.content = ''; r.image = ''; r.link = ''; r.mt = nowMs();
      ops.push(cPut('msgs', r));
    });
    // 2) сервер пометил сообщение удалённым
    dels.forEach(function (mid) {
      var r = byId[mid];
      if (!r) {
        r = { k: msgKey(chatId, mid), chat: chatId, id: mid, pos: index[mid] || 0,
              role: 'user', content: '', author: '', image: '', link: '', created: '', state: 'sent' };
      }
      if (r.del && !r.content && !r.image) return;
      r.del = 1; r.perm = 1; r.content = ''; r.image = ''; r.link = ''; r.mt = nowMs();
      if (index.hasOwnProperty(mid)) r.pos = index[mid];
      ops.push(cPut('msgs', r));
    });
    // 3) чего у клиента не было
    (j.msgs || []).forEach(function (m) {
      if (!m.id) return;
      ops.push(cPut('msgs', msgRec(chatId, m, index.hasOwnProperty(m.id) ? index[m.id] : 0)));
    });
    // 4) права на файлы и их размеры
    (j.files || []).forEach(function (f) { ops.push(mergeFile(chatId, f)); });
    return Promise.all(ops);
  }).then(function () {
    if (!dbOk) return;      // без кэша ничего рисовать не надо — сообщения уже на экране
    return cacheRenderChat(chatId, true);
  });
}

function mergeFile(chatId, f) {
  return cGet('files', f.id).then(function (old) {
    var rec = old || { id: f.id, loaded: 0, chunks: 0, state: 'none', at: nowMs() };
    var oldSize = rec.size || 0;
    rec.chat = rec.chat || chatId;
    rec.name = f.name || rec.name || '';
    rec.mime = f.mime || rec.mime || '';
    rec.size = f.vsize || f.size || rec.size || 0;
    rec.w = f.w || rec.w || 0;
    rec.h = f.h || rec.h || 0;
    rec.link = f.link || rec.link || ('/f/' + f.id);
    rec.perm = f.perm ? 1 : 0;
    rec.mt = nowMs();
    if (!f.perm) {
      rec.state = 'denied'; rec.loaded = 0; rec.chunks = 0;
      if (fileUrls[f.id]) { try { URL.revokeObjectURL(fileUrls[f.id]); } catch (e) {} delete fileUrls[f.id]; }
      showDenied(f.id);
      return cDropChunks(f.id).then(function () { return cPut('files', rec); });
    }
    if (rec.state === 'denied') { rec.state = 'none'; rec.loaded = 0; rec.chunks = 0; }
    // просмотр пересобрали — старые куски больше не подходят
    if (rec.state === 'done' && f.vsize > 0 && oldSize > 0 && oldSize !== f.vsize) {
      if (fileUrls[f.id]) { try { URL.revokeObjectURL(fileUrls[f.id]); } catch (e) {} delete fileUrls[f.id]; }
      return cDropChunks(f.id).then(function () {
        rec.state = 'none'; rec.loaded = 0; rec.chunks = 0;
        return cPut('files', rec);
      });
    }
    return cPut('files', rec);
  });
}

// список чатов: сервер прислал свой — чего нет, удаляем вместе с сообщениями
function applyChats(list) {
  list = list || [];
  var keep = {};
  list.forEach(function (d) { keep[d.id] = d; });
  return cAll('chats').then(function (old) {
    var has = {};
    old.forEach(function (c) { has[c.id] = c; });
    var drops = [];
    old.forEach(function (c) { if (!keep[c.id]) drops.push(dropChatCache(c.id)); });
    return Promise.all(drops).then(function () {
      var ops = [];
      list.forEach(function (d) {
        var c = has[d.id];
        if (!c) { ops.push(cPut('chats', chatRec(d))); return; }
        if (c.title === (d.title || '') && c.count === (d.count || 0) && c.updated === (d.updated || '') &&
            c.model === (d.model || '') && c.kind === (d.kind || '') && c.peer === (d.peer || '')) return;
        c.title = d.title || ''; c.kind = d.kind || ''; c.peer = d.peer || '';
        c.model = d.model || ''; c.shared = !!d.shared; c.count = d.count || 0;
        c.updated = d.updated || ''; c.mt = nowMs();
        ops.push(cPut('chats', c));
      });
      return Promise.all(ops);
    });
  });
}

function dropChatCache(chatId) {
  return cacheMsgs(chatId).then(function (list) {
    return Promise.all(list.map(function (m) { return cDel('msgs', m.k); }));
  }).then(function () { return cDel('chats', chatId); });
}

// ---------- файлы: сборка из кусков и докачка ----------
function ensureFile(rec) {
  if (!rec || !rec.perm) return;
  if (fileUrls[rec.id]) { updateImages(rec.id); return; }
  if (dlActive[rec.id]) return;
  if (rec.state === 'done') {
    dlActive[rec.id] = true;
    assembleFile(rec).then(function () { delete dlActive[rec.id]; });
    return;
  }
  if (dlQueue.some(function (x) { return x.id === rec.id; })) return;
  dlQueue.push(rec);
  pumpDownloads();
}
function pumpDownloads() {
  while (dlQueue.length && Object.keys(dlActive).length < DL_MAX) {
    var rec = dlQueue.shift();
    if (!rec || dlActive[rec.id] || fileUrls[rec.id]) continue;
    dlActive[rec.id] = true;
    downloadFile(rec.id).then(function () { pumpDownloads(); });
  }
}

function fileUrl(rec) {
  var t = nowMs();
  if (rec.state === 'done') { rec.mt = t; }
  rec.at = t;
  return cPut('files', rec);
}

function downloadFile(fid) {
  var myId = fid;
  return cGet('files', fid).then(function (rec) {
    if (!rec || !rec.perm) { delete dlActive[myId]; return; }
    if (rec.state === 'done') { return assembleFile(rec).then(function () { delete dlActive[myId]; }); }
    var from = rec.loaded || 0;
    var url = base + (rec.link || ('/f/' + fid)) + '?v=small&tk=' + encodeURIComponent(tok);
    var opt = {};   // браузерный HTTP-кеш не обходим: <img> уже мог скачать эти байты
    if (from > 0) opt.headers = { 'Range': 'bytes=' + from + '-' };
    return fetch(url, opt).then(function (r) {
      if (r.status === 403 || r.status === 404) {
        rec.state = 'denied'; rec.perm = 0; rec.mt = nowMs();
        showDenied(fid);
        return cDropChunks(fid).then(function () { return cPut('files', rec); }).then(function () { delete dlActive[myId]; });
      }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var resumed = r.status === 206;
      var prep = Promise.resolve();
      if (resumed) {
        // смещение могло устареть, если просмотр пересобрали — сверяем общий размер
        var cr = r.headers.get('Content-Range') || '';
        var cm = /\/(\d+)\s*$/.exec(cr);
        var tot = cm ? Number(cm[1]) : 0;
        if (tot > 0 && rec.size > 0 && tot !== rec.size) {
          return cDropChunks(fid).then(function () {
            rec.chunks = 0; rec.loaded = 0; rec.size = tot; rec.state = 'none'; rec.mt = nowMs();
            return cPut('files', rec);
          }).then(function () { delete dlActive[myId]; return downloadFile(fid); });
        }
      } else if (from > 0) {
        // сервер отдал всё целиком — старые куски больше не продолжение файла
        from = 0;
        prep = cDropChunks(fid).then(function () { rec.chunks = 0; rec.loaded = 0; });
      }
      var headLen = Number(r.headers.get('Content-Length') || 0);
      var total = headLen > 0 ? headLen + from : (rec.size || 0);
      var reader = r.body.getReader();
      var parts = [], partLen = 0, got = from, lastPaint = 0;

      function flush() {
        if (!parts.length) return Promise.resolve();
        var all = new Uint8Array(partLen), at = 0;
        parts.forEach(function (u) { all.set(u, at); at += u.length; });
        parts = []; partLen = 0;
        var idx = rec.chunks || 0;
        rec.chunks = idx + 1;
        rec.loaded = got;
        rec.state = 'part';
        rec.at = nowMs();
        return Promise.all([
          cPut('chunks', { k: fid + '|' + idx, file: fid, i: idx, data: all.buffer }),
          cPut('files', rec)
        ]);
      }
      function paint(force) {
        var t = nowMs();
        if (!force && t - lastPaint < 400) return;
        lastPaint = t;
        showProgress(fid, total > 0 ? Math.min(99, Math.round(100 * got / total)) : 0);
      }
      function step() {
        return reader.read().then(function (x) {
          if (x.done) {
            return flush().then(function () {
              rec.loaded = got; rec.state = 'done'; rec.total = total; rec.size = total;
              rec.perm = 1; rec.mt = nowMs();
              return cPut('files', rec).then(function () { return assembleFile(rec); });
            }).then(function () { delete dlActive[myId]; });
          }
          parts.push(x.value); partLen += x.value.length; got += x.value.length;
          paint();
          if (partLen >= 262144) return flush().then(step);
          return step();
        });
      }
      paint(true);
      return prep.then(step);
    }).catch(function () {
      // связь оборвалась: куски остаются, следующее открытие чата продолжит с loaded
      delete dlActive[myId];
    });
  });
}

function assembleFile(rec) {
  return cByIndex('chunks', 'file', rec.id).then(function (chunks) {
    if (!chunks || !chunks.length) {
      // куски потеряли (чужой perm, чистка) — при следующем показе скачаем заново
      if (rec.state === 'done') { rec.state = 'none'; rec.mt = nowMs(); return cPut('files', rec); }
      return;
    }
    chunks.sort(function (a, b) { return a.i - b.i; });
    var parts = [];
    for (var i = 0; i < chunks.length; i++) parts.push(new Blob([chunks[i].data]));
    var blob = new Blob(parts, { type: rec.mime || 'image/jpeg' });
    if (fileUrls[rec.id]) { try { URL.revokeObjectURL(fileUrls[rec.id]); } catch (e) {} }
    fileUrls[rec.id] = URL.createObjectURL(blob);
    updateImages(rec.id);
    var t = nowMs();
    rec.at = t; rec.mt = t;
    return cPut('files', rec);
  });
}

function cDropChunks(fid) {
  return cacheOpen().then(function (d) {
    if (!d) return;
    return cReq(d.transaction('chunks', 'readonly').objectStore('chunks').index('file').getAllKeys(fid))
      .then(function (keys) {
        if (!keys || !keys.length) return;
        var tx = d.transaction('chunks', 'readwrite');
        var st = tx.objectStore('chunks');
        keys.forEach(function (k) { st.delete(k); });
        return cDone(tx);
      });
  }).catch(function () {});
}

function updateImages(fid) {
  var u = fileUrls[fid];
  if (!u) return;
  var imgs = document.querySelectorAll('img[data-fid="' + fid + '"]');
  for (var i = 0; i < imgs.length; i++) { imgs[i].src = u; imgs[i].style.display = ''; }
  var waits = document.querySelectorAll('[data-fwait="' + fid + '"]');
  for (var j = 0; j < waits.length; j++) waits[j].textContent = '';
}
function showProgress(fid, pct) {
  var waits = document.querySelectorAll('[data-fwait="' + fid + '"]');
  for (var j = 0; j < waits.length; j++) waits[j].textContent = 'кэш ' + pct + '%';
}
function showDenied(fid) {
  saveImagesOff(fid);
  var waits = document.querySelectorAll('[data-fwait="' + fid + '"]');
  for (var j = 0; j < waits.length; j++) waits[j].textContent = t("chat.err.file", "file unavailable");
}
function saveImagesOff(fid) {
  var imgs = document.querySelectorAll('img[data-fid="' + fid + '"]');
  for (var i = 0; i < imgs.length; i++) { imgs[i].style.display = 'none'; }
}

// ---------- push: новое или удалённое сообщение ----------
function onPushMsg(e) {
  var chatId = e.c, m = e.m;
  if (!dbOk) {
    // без кэша сообщение держим только на экране
    if (m && m.id && cur && cur.id === chatId) {
      curData.messages = (curData.messages || []).concat([recMsg(msgRec(chatId, m, 0))]);
      drawMessages(curData.messages, true);
    }
    updateChatCount(chatId, e.n);
    return;
  }
  if (m && m.id) {
    var pos = (typeof e.n === 'number' && e.n > 0) ? e.n - 1 : 0;
    cPut('msgs', msgRec(chatId, m, pos)).then(function () {
      if (cur && cur.id === chatId) cacheRenderChat(chatId, true);
    });
  } else if (e.mid) {
    // сообщение длинное и в событие не влезло — догружаем одно по id
    api('/__msg?id=' + encodeURIComponent(chatId) + '&mid=' + encodeURIComponent(e.mid), { ms: 15000 })
      .then(function (r) {
        var j = (r && r.json) || {};
        if (!r.ok || !j.id) return;
        var pos = (typeof e.n === 'number' && e.n > 0) ? e.n - 1 : 0;
        return cPut('msgs', msgRec(chatId, j, pos)).then(function () {
          if (cur && cur.id === chatId) cacheRenderChat(chatId, true);
        });
      });
  }
  updateChatCount(chatId, e.n);
}

function onPushDel(e) {
  var ids = String(e.d || '').split(',');
  if (!dbOk) {
    if (cur && cur.id === e.c && curData && curData.messages) {
      curData.messages.forEach(function (m) {
        if (ids.indexOf(m.id) >= 0) { m.deleted = true; m.content = ''; m.image = ''; }
      });
      drawMessages(curData.messages, true);
    }
    updateChatCount(e.c, e.n);
    return;
  }
  Promise.all(ids.map(function (mid) {
    return cGet('msgs', msgKey(e.c, mid)).then(function (r) {
      if (!r) return;
      r.del = 1; r.content = ''; r.image = ''; r.link = ''; r.mt = nowMs();
      return cPut('msgs', r);
    });
  })).then(function () {
    if (cur && cur.id === e.c) cacheRenderChat(e.c, true);
  });
  updateChatCount(e.c, e.n);
}

function updateChatCount(chatId, n) {
  if (typeof n !== 'number') return;
  for (var i = 0; i < dialogs.length; i++) {
    if (dialogs[i].id !== chatId) continue;
    dialogs[i].count = n;
    cGet('chats', chatId).then(function (c) {
      if (!c) return;
      c.count = n; c.mt = nowMs();
      return cPut('chats', c);
    });
    renderAll();
    break;
  }
}

// ---------- чистка старых записей ----------
function pruneCache() {
  var last = Number(ls(PRUNE_KEY) || 0);
  if (nowMs() - last < 6 * 3600 * 1000) return Promise.resolve();
  lss(PRUNE_KEY, String(nowMs()));
  var cutChats = nowMs() - CACHE_KEEP_DAYS * 86400 * 1000;
  var cutFiles = nowMs() - CACHE_FILE_DAYS * 86400 * 1000;
  return cAll('chats').then(function (chats) {
    return Promise.all(chats.map(function (c) {
      if ((c.at || 0) > cutChats) return null;
      return cacheMsgs(c.id).then(function (list) {
        return Promise.all(list.map(function (m) { return cDel('msgs', m.k); }));
      });
    }));
  }).then(function () {
    return cAll('files');
  }).then(function (files) {
    return Promise.all(files.map(function (f) {
      if (f.perm && (f.at || 0) > cutFiles) return null;
      if (fileUrls[f.id]) { try { URL.revokeObjectURL(fileUrls[f.id]); } catch (e) {} delete fileUrls[f.id]; }
      return cDropChunks(f.id).then(function () { return cDel('files', f.id); });
    }));
  });
}

// ---------- status.json: где сейчас живёт сервер ----------
function b64ToText(b64) {
  var bin = atob(String(b64).replace(/\s/g, ''));
  var n = bin.length, bytes = new Uint8Array(n), i;
  for (i = 0; i < n; i++) bytes[i] = bin.charCodeAt(i);
  if (window.TextDecoder) return new TextDecoder('utf-8').decode(bytes);
  var s = '';
  for (i = 0; i < n; i++) s += String.fromCharCode(bytes[i]);
  return decodeURIComponent(escape(s));
}
function statusFrom(r) {
  if (!r || !r.ok) return null;
  var j = r.json || {};
  if (typeof j.content === 'string' && j.encoding === 'base64') {
    try { j = JSON.parse(b64ToText(j.content)); } catch (e) { return null; }
  }
  return (j && (typeof j.url === 'string' || j.connections)) ? j : null;
}
function connsOf(j) {
  var out = [], arr = j && j.connections, i;
  if (Object.prototype.toString.call(arr) === '[object Array]') {
    for (i = 0; i < arr.length; i++) {
      var c = arr[i] || {};
      if (typeof c.url !== 'string' || !c.url) continue;
      out.push({ url: c.url.replace(/\/+$/, ''), updated: Date.parse(c.created || '') || 0 });
    }
  }
  if (!out.length && j && typeof j.url === 'string' && j.url)
    out.push({ url: j.url.replace(/\/+$/, ''), updated: Date.parse(j.updated || '') || 0 });
  return out;
}
function statusList() {
  var bust = '?v=' + Date.now();
  var reqs = [ fetchJSON(API, { headers: { 'Accept': 'application/vnd.github+json' } }, 7000),
               fetchJSON(LOCAL + bust, null, 5000),
               fetchJSON(RAW + bust, null, 7000) ];
  return Promise.all(reqs).then(function (res) {
    var seen = {}, out = [], i, k;
    for (i = 0; i < res.length; i++) {
      var list = connsOf(statusFrom(res[i]));
      for (k = 0; k < list.length; k++) {
        var u = list[k].url;
        if (seen[u]) { if (list[k].updated > seen[u].updated) seen[u].updated = list[k].updated; continue; }
        seen[u] = list[k];
      }
    }
    for (var key in seen) if (Object.prototype.hasOwnProperty.call(seen, key)) out.push(seen[key]);
    var mem = ls(URLKEY);
    if (mem && !seen[mem]) out.push({ url: mem, updated: -1 });
    out.sort(function (a, b) { return b.updated - a.updated; });
    var now = Date.now();
    var fresh = out.filter(function (x) { return x.updated <= 0 || (now - x.updated) / 60000 <= STALE_MIN; });
    var stale = out.filter(function (x) { return x.updated > 0 && (now - x.updated) / 60000 > STALE_MIN; });
    return fresh.concat(stale);
  });
}
function ping(url) {
  if (!url) return Promise.resolve(false);
  return fetchJSON(url + '/__door/hi', null, 6000).then(function (r) {
    return !!(r.ok && r.json && r.json.ok === true);
  });
}
function firstLive(urls) {
  return new Promise(function (resolve) {
    if (!urls.length) { resolve(''); return; }
    var left = urls.length, done = false;
    urls.forEach(function (u) {
      ping(u).then(function (alive) {
        left--;
        if (alive && !done) { done = true; resolve(u); }
        else if (left === 0 && !done) { done = true; resolve(''); }
      });
    });
  });
}
function findLive() {
  var mem = ls(URLKEY);
  var quick = mem ? [mem] : [];
  var slow = statusList().then(function (list) { return list.map(function (x) { return x.url; }); });
  return new Promise(function (resolve) {
    var done = false, pending = 2;
    function hit(u) {
      if (done) return;
      if (u) { done = true; resolve(u); return; }
      if (--pending === 0) { done = true; resolve(''); }
    }
    firstLive(quick).then(hit);
    slow.then(firstLive).then(hit);
  });
}

function net(on, text) {
  $('ndot').className = 'dot' + (on ? ' on' : '');
  $('ntext').textContent = text;
}

// ---------- вход ----------
function showLogin(title, msg) {
  $('lht').textContent = title || t("chat.login.need", "Sign in needed");
  $('lmsg').textContent = msg || t("chat.login.sub", "The chat page lives on GitHub, the conversation lives on your home PC.");
  $('lgo').href = GH + '/accounts/?next=' + encodeURIComponent(PAGEURL);
  $('login').className = 'on';
}
function hideLogin() { $('login').className = ''; }

function takeTokenFromUrl() {
  var m = /[?&]tk=([^&]+)/.exec(location.search);
  if (!m) return '';
  var t = '';
  try { t = decodeURIComponent(m[1]); } catch (e) { return ''; }
  if (t) {
    // ?tk=<ключ> — это быстрый ключ устройства (так работает ссылка из админки),
    // а не сеанс: кладём его в door.key, а страница сама обменяет его на токен
    // через /__door/auth. Сеанс от прежнего входа сразу забываем.
    lss('door.key', t);
    lsd(TOK);
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }
  return '';
}

// личная ссылка вида /AI-Human-Messenger/<ключ> (её отдаёт 404.html — копия страницы):
// ключ из пути становится быстрым ключом устройства и стирается из адреса
function takeKeyFromPath() {
  var p = location.pathname || '';
  var m = /^\/AI-Human-Messenger\/([A-Za-z0-9_-]{16,64})\/?$/.exec(p);
  if (!m) return '';
  lss('door.key', m[1]);
  try { history.replaceState(null, '', '/AI-Human-Messenger/'); } catch (e) {}
  return m[1];
}

function boot(retry) {
  retry = retry || 0;
  clearTimeout(bootT);
  net(false, t("chat.net.searching", "looking for server…"));
  takeKeyFromPath();
  var local = /^(127\.0\.0\.1|localhost)$/i.test(location.hostname);
  var ready = local ? Promise.resolve(location.origin) : findLive();
  ready.then(function (url) {
    if (!url) {
      net(false, t("chat.net.down", "server is not responding"));
      showLogin(t("chat.err.offline", "Server is not online"), t("chat.err.offline.hint", "Turn on the PC («2. Server» window) — the page will find the new bridge address itself."));
      // пробуем сами, пока не найдём: 2,5 → 15 с (без кнопок и перезагрузок)
      bootT = setTimeout(function () { boot(retry + 1); }, Math.min(15000, 2500 * Math.pow(1.4, Math.min(retry, 8))));
      return;
    }
    base = url.replace(/\/+$/, '');
    if (!local) lss(URLKEY, base);
    net(true, t("chat.net.up", "server is online"));
    tok = takeTokenFromUrl() || ls(TOK);
    return verify().then(function (ok) {
      if (ok) { hideLogin(); return start(); }
      var key = ls('door.key');
      if (!key) { showLogin(); return; }
      return post('/__door/auth', { key: key }).then(function (r) {
        var j = r.json || {};
        if (r.ok && j.ok && j.token) {
          tok = j.token; lss(TOK, tok);
          return verify().then(function (ok2) {
            if (ok2) { hideLogin(); start(); }
            else showLogin(t("chat.err.keydead", "Sign-in no longer works"), t("chat.err.keydead.hint", "The key of this device was not accepted — sign in again."));
          });
        }
        // Мост мог сменить адрес посреди работы: связь оборвалась — ключ НЕ стираем,
        // а ищем сервер заново. Ключ гасим только при явном отказе (401/403).
        if (r.status === 0) {
          showLogin(t("chat.err.link", "Connection dropped"), t("chat.err.link.hint", "The page is looking for a new bridge address — wait a couple of seconds or press “Check the connection again”."));
          if (retry < 1) setTimeout(function () { boot(retry + 1); }, 2500);
          return;
        }
        lsd('door.key');
        showLogin(t("chat.err.keydead", "Sign-in no longer works"), t("chat.err.keydead.hint", "The key of this device was not accepted — sign in again."));
      });
    });
  });
}

function verify() {
  if (!tok) return Promise.resolve(false);
  return api('/__me', { ms: 9000 }).then(function (r) {
    var j = r.json || {};
    if (r.ok && (j.user || j.ok)) {
      me = j.user || '';
      realMe = j.real || me;
      actName = j.act || '';
      admin = !!j.admin;
      lss('door.user', me);
      return true;
    }
    if (r.status === 401 || r.status === 403) { lsd(TOK); tok = ''; }
    return false;
  });
}

function start() {
  showMe();
  renderManage();
  loadModels();
  loadPeople();
  if (window.UI) UI.sync(base, tok);   // тема и язык: у человека они на сервере
  cacheBoot();        // сначала то, что уже есть в браузере (мгновенное переключение)
  refreshDialogs();   // потом сеть: /__boot + сверка списка чатов
  pruneCache();       // чистка старых записей по датам mt/at
  channel();          // канал событий: вместо опроса диалога каждые 6 секунд

// «Сергей (Дима Администратор)» — кто на самом деле держит сессию
function showMe() {
  var nm = actName || me;
  $('mename').textContent = (actName && realMe && actName !== realMe)
    ? actName + ' (' + realMe + ', ' + t('chat.act.admin', 'admin') + ')'

    $('actb').className = '';

function refreshDialogs() {
  return api('/__boot', { ms: 20000 }).then(function (r) {
    var j = r.json || {};
    // без сети (status 0) или без списка чатов кэш не трогаем — иначе выбросим всё
    if (!r.ok || !(j.dialogs instanceof Array)) return;
    if (j.user) { me = j.user; }
    realMe = j.real || realMe;
    actName = j.act || '';
    admin = !!j.admin;
    showMe();
    var list = j.dialogs || [];
    return applyChats(list).then(function () {
      dialogs = list.map(chatOut);
      if (!cur) {
        var want = pickStart();
        if (want) open(want);
      } else {
        // открытый чат мог исчезнуть (удалён или отобран доступ)
        var d = null;
        for (var i = 0; i < dialogs.length; i++) if (dialogs[i].id === cur.id) { d = dialogs[i]; break; }
        if (!d) {
          cur = null; curData = null; lastCount = -1;
          $('log').innerHTML = ''; $('title').textContent = t("chat.pick.chat", "pick a conversation");
        } else {
          cur = d;
          if (d.title) $('title').textContent = titleOf(d);

}

function pickStart() {
  var shared = null, best = null;

}

function isPm(d) { return d.kind === 'pm' || d.shared; }

function iconOf(d) {

function titleOf(d) {

  if (d.kind === 'pm') return d.peer || t("chat.pm", "personal conversation");
  return d.title || t("chat.new.chat", "New chat");

function subOf(d) {

  if (d.shared) bits.push(t("chat.common.low", "general chat"));

function open(d) {

function imageSrc(link, small) {
  if (!link) return '';
  return base + link + '?v=' + (small ? 'small' : 'full') + '&tk=' + encodeURIComponent(tok);
}

// полный файл как скачивание: имя берётся из паспорта на сервере
function fileDownload(link) {
  if (!link) return '#';
  return base + link + (link.indexOf('?') >= 0 ? '&' : '?') + 'raw=1&dl=1&tk=' + encodeURIComponent(tok);
}

// один элемент сообщения (и для полной отрисовки, и для догрузки дельты)
function msgEl(m) {
  var mine = (me || '').toLowerCase();
  var el = document.createElement('div');
  if (m.deleted) {
    el.className = 'm gone';
    el.textContent = t("chat.msg.deleted", "message deleted");
    if (m.id) el.setAttribute('data-mid', m.id);
    return el;
  }
  var own = m.role === 'user' && (!m.author || m.author.toLowerCase() === mine);
  el.className = 'm ' + (m.role === 'assistant' ? (m.content.indexOf('⏹') === 0 ? 'th' : 'a') : (own ? 'u' : 'a'));
  if (m.state === 'sending') el.className += ' pend';
  if (m.state === 'error') {
    el.className += ' err';
    el.title = t("chat.msg.failed", "not sent — press to retry");
    el.onclick = function () { retryMsg(m); };
  }
  if (m.id) el.setAttribute('data-mid', m.id);
  if (own && m.id && m.state !== 'sending') {
    // своё сообщение: долгое нажатие (правый клик) — удалить, останется пометка
    el.oncontextmenu = function (ev) { ev.preventDefault(); askDelete(m); };
  }
  if (m.author && !own) {
    var w = document.createElement('div');
    w.className = 'who';
    w.textContent = m.author;
    el.appendChild(w);
  }
  if (m.content) {
    var t = document.createElement('div');
    t.textContent = m.content;
    el.appendChild(t);
  }
  if (m.image) {
    var wrap = document.createElement('div');
    wrap.className = 'mimg';
    var im = document.createElement('img');
    im.loading = 'lazy';
    im.alt = t("chat.picture", "picture");
    im.setAttribute('data-fid', m.image);
    if (fileUrls[m.image]) im.src = fileUrls[m.image];
    else if (m.link) im.src = imageSrc(m.link, true);   // progressive: браузер рисует по мере прихода
    else im.style.display = 'none';
    im.onclick = function () {
      var u = fileUrls[m.image] || (m.link ? imageSrc(m.link, false) : '');
      if (u) window.open(u, '_blank');
    };
    im.onerror = function () {
      if (this.dataset.retry) return;
      this.dataset.retry = '1';
      if (m.link) this.src = imageSrc(m.link, false);
    };
    wrap.appendChild(im);
    // оригинал — линейкой: изначальное название сохраняется в паспорте файла
    var dl = document.createElement('a');
    dl.className = 'dl';
    dl.title = t("chat.dl.original", "download original (as uploaded)");
    dl.textContent = '⬇';
    dl.href = fileDownload(m.link);
    dl.setAttribute('download', '');
    wrap.appendChild(dl);
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'shr';
    b.title = t("chat.share.pic", "share the picture");
    b.textContent = '🔗';
    b.onclick = function () { shareImage(m.link); };
    wrap.appendChild(b);
    var wait = document.createElement('div');
    wait.className = 'fwait';
    wait.setAttribute('data-fwait', m.image);
    wait.textContent = fileUrls[m.image] ? '' : t("chat.cache.dots", "cache…");
    wrap.appendChild(wait);
    el.appendChild(wrap);
    prepFile(m.image);
  }
  return el;
}

function drawMessages(msgs, keep) {
  var log = $('log');
  var near = (log.scrollHeight - log.scrollTop - log.clientHeight) < 120;
  var top = log.scrollTop;
  log.innerHTML = '';
  msgs.forEach(function (m) { log.appendChild(msgEl(m)); });
  if (!keep || near) log.scrollTop = log.scrollHeight;
  else log.scrollTop = top;
  $('cfg').disabled = !isAiDialog();
}

// добавить только новые сообщения — без перерисовки всего и без прыжка прокрутки

// ---------- отправка ----------
function isAiDialog() { return !!(curData && curData.model && !curData.shared && curData.kind !== 'pm'); }

function setBusy(on, text) {
  busy = on;
  $('send').className = on ? 'busy' : '';
  $('typing').className = on ? 'on' : '';
  if (text) $('typing').textContent = text;
}

function send() {
  var textEl = $('text');
  var q = textEl.value.trim();
  if (!q || !cur || busy) return;
  textEl.value = '';
  if (isAiDialog()) return sendAi(q);
  setBusy(true, t("chat.sending", "sending…"));
  var cid = newCid();
  var mid = newMid();
  var pos = localPos;
  localPos = pos + 1;
  // id у сообщения есть ещё до отправки: и в кэше, и на сервере — один объект.
  // Пока ответа нет — статус sending (полупрозрачное), ошибка — err (по нажатию повтор)
  var rec = msgRec(cur.id, { id: mid, role: 'user', content: q, author: me }, pos);
  rec.state = 'sending';
  cPut('msgs', rec).then(function () { cacheRenderChat(cur.id); });
  deliver(cur.id, q, cid, mid, 0);
}

// ключ сообщения: повтор после обрыва не задваивает запись (сервер помнит cid)
function newCid() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

// id сообщения (16 hex) — такой же формат, как у сервера
function newMid() {
  var s = '';
  for (var i = 0; i < 16; i++) s += Math.floor(Math.random() * 16).toString(16);
  return s;
}

function markMsgState(chatId, mid, state) {
  return cGet('msgs', msgKey(chatId, mid)).then(function (r) {
    if (!r) return;
    r.state = state; r.mt = nowMs();
    return cPut('msgs', r).then(function () {
      if (cur && cur.id === chatId) cacheRenderChat(chatId, true);
    });
  });
}

function retryMsg(m) {
  if (!cur || !m || !m.id) return;
  setBusy(true, t("chat.sending", "sending…"));
  markMsgState(cur.id, m.id, 'sending');
  deliver(cur.id, m.content, newCid(), m.id, 0);
}

// удаление: на сервере остаётся tombstone, у всех на его месте — «сообщение удалено»
function askDelete(m) {
  if (!cur || !m || !m.id) return;
  if (!confirm(t("chat.del.confirm", "Delete the message? “message deleted” will stay in its place."))) return;
  post('/__msg/delete', { id: cur.id, mid: m.id }, 15000).then(function (r) {
    var j = r.json || {};
    if (!r.ok || j.ok === false) { toast(j.error || t("chat.err.delfail", "not deleted")); return; }
    onPushDel({ c: cur.id, d: m.id, n: (lastCount > 0 ? lastCount : 1) });
  });
}

function deliver(id, text, cid, mid, tryN) {
  post('/__msg', { id: id, text: text, cid: cid, mid: mid }, 20000).then(function (r) {
    var j = r.json || {};
    if (r.ok && j.ok !== false) {
      setBusy(false);
      markMsgState(id, mid, 'sent');
      return;
    }
    // ответ мог потеряться уже после записи на диск — повторяем с тем же cid и mid
    if ((r.status === 0 || r.status >= 500) && tryN < 2) {
      setTimeout(function () { deliver(id, text, cid, mid, tryN + 1); }, 2500);
      return;
    }
    setBusy(false);
    markMsgState(id, mid, 'error');
    toast(j.error || (r.status ? t('chat.err.sendfail', 'not sent (HTTP ') + r.status + ')' :
      t("chat.err.offline.tap", "no connection — tap the message to retry")));
  });
}

function sendAi(q) {
  setBusy(true, t("chat.typing", "AI is thinking…"));
  var d = curData || {};
  var msgs = [], allHist = [];
  if (d.systemPrompt) msgs.push({ role: 'system', content: d.systemPrompt });
  (d.messages || []).forEach(function (m) {
    // удалённые оставляем местом (id), но модели их не отдаём
    if (m.deleted) { allHist.push({ id: m.id, role: m.role || 'user', content: '', deleted: true }); return; }
    if (!m.content) return;
    allHist.push({ id: m.id, role: m.role, content: m.content, author: m.author || '' });
    msgs.push({ role: m.role, content: m.content });
  });
  msgs.push({ role: 'user', content: q });
  drawMessages(allHist.concat([{ role: 'user', content: q }]));
  fetchJSON(base + '/v1/chat/completions', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json', 'X-Chat-Id': cur.id },
    body: JSON.stringify({ messages: msgs, stream: false, max_tokens: d.maxTokens || 512, temperature: d.temperature || 0.7 })
  }, 300000).then(function (r) {
    var j = r.json || {};
    var acc = '';
    try { acc = j.choices[0].message.content || ''; } catch (e) {}
    if (r.status === 503) throw new Error(t("chat.err.loading", "the model is loading now — try again in half a minute"));
    if (!r.ok || !acc) throw new Error((j.error && (j.error.message || j.error)) || (t('chat.err.noanswer', 'no answer (HTTP ') + r.status + ')'));
    var hist = allHist.concat([{ role: 'user', content: q }, { role: 'assistant', content: acc }]);
    return post('/__log', { id: cur.id, user: q, assistant: acc, messages: hist }, 30000).then(function () { loadDialog(); });
  }).catch(function (e) {
    net(false, t("chat.err.conn.drop", "connection dropped"));
    setBusy(false);
    $('text').value = q;
    toast(t('chat.err.prefix', 'Failed: ') + (e && e.message ? e.message : e));
    setTimeout(function () { net(true, t("chat.net.up", "server is online")); loadDialog(); }, 2500);
  }).then(function () { setBusy(false); });
}

// sha256 содержимого на клиенте: если такой файл уже есть, грузить нечего
function sha256hex(buf) {
  if (!window.crypto || !crypto.subtle) return Promise.resolve('');
  try {
    return crypto.subtle.digest('SHA-256', buf).then(function (h) {
      var b = new Uint8Array(h), s = '';
      for (var i = 0; i < b.length; i++) s += (b[i] < 16 ? '0' : '') + b[i].toString(16);
      return s;
    }).catch(function () { return ''; });
  } catch (e) { return Promise.resolve(''); }
}

function upload(file) {
  if (!file || !cur) return;
  if (file.size > 24 * 1024 * 1024) { toast(t("chat.err.bigfile", "File is larger than 24 MB")); return; }
  setBusy(true, t("chat.hash.count", "counting the hash…"));
  var reader = new FileReader();
  reader.onload = function () {
    sha256hex(reader.result).then(function (sha) {
      if (!sha) { sendFile(file, ''); return; }
      // такой файл уже есть? тогда не грузим — показываем готовый
      post('/__file/check', { sha: sha }, 15000).then(function (r) {
        var j = r.json || {};
        if (r.ok && j.exists && j.file && j.file.id) {
          post('/__file/link', { file: j.file.id, chat: cur.id }, 15000).then(function (r2) {
            setBusy(false);
            if (!r2.ok) { toast((r2.json || {}).error || t("chat.err.showfile", "failed to show the file")); return; }
            toast(t("chat.file.dup", "that file was already here — shown without upload"));
            loadDialog();
          });
          return;
        }
        sendFile(file, sha);
      }).catch(function () { sendFile(file, sha); });
    });
  };
  reader.onerror = function () { setBusy(false); toast(t("chat.err.readfile", "could not read the file")); };
  reader.readAsArrayBuffer(file);
}

// сама отправка байтов, с процентом загрузки (fetch прогресс не показывает)
function sendFile(file, sha) {
  if (!cur) return;
  var q = '/__file/upload?name=' + encodeURIComponent(file.name) + '&id=' + encodeURIComponent(cur.id) +
          (sha ? '&sha=' + sha : '');
  var xhr = new XMLHttpRequest();
  xhr.open('POST', base + q, true);
  xhr.setRequestHeader('Authorization', 'Bearer ' + tok);
  xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
  xhr.upload.onprogress = function (e) {
    if (e.lengthComputable && e.total > 0)
      setBusy(true, t('chat.uploading', 'uploading ') + Math.round(100 * e.loaded / e.total) + '%');
  };
  xhr.onload = function () {
    setBusy(false);
    var j = {};
    try { j = JSON.parse(xhr.responseText || '{}'); } catch (e) {}
    if (xhr.status !== 200) { toast(j.error || t("chat.err.upload", "upload failed")); return; }
    if (j.dup) toast(t("chat.file.dup2", "that file was already here — the ready one is shown"));
    loadDialog();
  };
  xhr.onerror = function () { setBusy(false); toast(t("chat.noconn", "no connection")); };
  setBusy(true, t("chat.uploading2", "uploading…"));
  xhr.send(file);
}

// ---------- канал событий ----------
// Сервер держит запрос до 25 с и отвечает сразу, как только что-то случилось.
// Событие — уведомление: {s: номер, k: вид, c: диалог, a: кто, n: сколько сообщений}.
// Сами сообщения забираем дельтой /__dialog?after=N — сотни байт вместо всего диалога.
var chSeq = 0, chDown = 0, chBusy = false, chTimer = 0, chWait = 25, chOn = false;
var listT = 0, peopleT = 0;

function channel() {
  if (chOn) return;   // один канал на страницу
  chOn = true;
  chSeq = Number(ls('ch.seq') || 0) || 0;
  chDown = 0;
  poll();
}

function poll() {
  clearTimeout(chTimer);
  if (!base || !tok || chBusy) return;
  chBusy = true;
  var t0 = Date.now();
  post('/__events', { since: chSeq, wait: chWait }, 40000).then(function (r) {
    chBusy = false;
    var j = r.json || {};
    if (r.status === 401 || r.status === 403) {
      lsd(TOK); tok = '';
      showLogin(t("chat.err.keydead", "Sign-in no longer works"), t("chat.err.signin", "Sign in again — the key or password is outdated."));
      return;
    }
    var ok = r.ok && typeof j.seq === 'number';
    var wait = 0;
    if (ok) {
      chDown = 0;
      chWait = 25;
      net(true, t("chat.net.up", "server is online"));
      if (j.reset) resync();
      chSeq = j.seq;
      lss('ch.seq', String(chSeq));
      var list = j.events || [];
      for (var i = 0; i < list.length; i++) onEvent(list[i]);
      if (!list.length && Date.now() - t0 < 800) wait = 800;   // не крутимся вхолостую
    } else {
      chDown++;
      // если туннель рвёт долгие запросы — держим короче, чтобы не молотить вхолостую
      if (chDown >= 3 && chWait > 12) chWait = 12;
      // 404 = сервер старой сборки (в нём ещё нет /__events)
      if (r.status === 404) net(false, t("chat.err.oldserver", "old server version — restart the “1. Neural networks” window"));
      else net(false, chDown > 2 ? t("chat.err.conn.bridge", "connection dropped — looking for the bridge") : t("chat.reconnect", "restoring the connection…"));
      if (chDown === 2) refind();
      wait = Math.min(15000, 800 * Math.pow(2, Math.min(chDown, 4)));
    }
    chTimer = setTimeout(poll, wait);
  });
}

// новый адрес моста (туннель перезапускается сам и меняет адрес)
function refind() {
  // локальная проверка: адрес задан браузером, искать мост не нужно
  if (/^(127\.0\.0\.1|localhost)$/i.test(location.hostname)) return;
  findLive().then(function (u) {
    if (!u) return;
    u = u.replace(/\/+$/, '');
    if (u !== base) { base = u; lss(URLKEY, base); }
  });
}

// сервер перезапустился или мы слишком долго были без связи — полная сверка
function resync() {
  refreshDialogs();
  loadPeople();
  if (cur) loadDialog();   // могли прийти сообщения, пока нас не было
}

function onEvent(e) {
  var k = (e && e.k) || '';
  if (k === 'msg') {
    onPushMsg(e);          // сообщение уже в событии — без отдельного запроса
    listDirty();
  } else if (k === 'del') {
    onPushDel(e);          // удаление: на месте сообщения — «сообщение удалено»
    listDirty();
  } else if (k === 'img') {
    if (cur && e.c === cur.id) syncChat(cur.id);
    listDirty();
  } else if (k === 'chat' || k === 'acc') {
    listDirty();
  } else if (k === 'people') {
    clearTimeout(peopleT);
    peopleT = setTimeout(function () { loadPeople(); }, 400);
  }
}

function listDirty() {
  clearTimeout(listT);
  listT = setTimeout(refreshList, 250);
}

// список чатов: свой список id туда, серверный — обратно; чего нет — выбрасываем
function refreshList() {
  return post('/__chats/sync', {}, 15000).then(function (r) {
    var j = r.json || {};
    if (!j.chats) return;
    return applyChats(j.chats).then(function () {
      dialogs = j.chats.map(chatOut);
      if (cur) {
        var d = null;
        for (var i = 0; i < dialogs.length; i++) if (dialogs[i].id === cur.id) { d = dialogs[i]; break; }
        if (!d) {
          cur = null; curData = null; lastCount = -1;
          $('log').innerHTML = ''; $('title').textContent = t("chat.pick.chat", "pick a conversation");
        } else cur = d;
      }
      renderAll();
    });
  });
}

function mlist(items, onPick) {
  var box = document.createElement('div');

      for (var i = 0; i < all.length; i++) all[i].className = 'mi';
      el.className = 'mi on';
      onPick(it.value);

  });
  return box;
}

// ---------- настройки бота ----------
var PRESETS = [
  { id: 'draft', name: t("chat.draft", "Draft"), w: 240, h: 320, steps: 6 },
  { id: 'portrait', name: t("chat.portrait", "Portrait"), w: 320, h: 480, steps: 10 },
  { id: 'square', name: t("chat.square", "Square"), w: 384, h: 384, steps: 10 }
];
var MIN_D = 144, MAX_D = 720, ASPECT_MIN = 0.25, ASPECT_MAX = 4;

function snap(v) { return Math.max(MIN_D, Math.min(MAX_D, Math.round(v / 8) * 8)); }

function modelOf(id) {
  return models.filter(function (m) { return m.id === id; })[0] || null;
}

function openCfg() {
  if (!curData) return;
  var isImg = (modelOf(curData.model) || {}).type === 'image';
  var sheet = $('sheet');
  $('modal').className = 'on';
  if (!isImg) {
    sheet.innerHTML = '<h3>' + t('chat.settings.chat.title', 'Chat settings') + '</h3>' +
      '<p class="h">Это текстовая модель — размер картинки не нужен.</p>' +
      '<div class="fld"><label>' + t('chat.temp', 'Temperature') + ' <b id="tv">' + (curData.temperature || 0.7) + '</b></label>' +
      '<input type="range" id="temp" min="0" max="2" step="0.1" value="' + (curData.temperature || 0.7) + '">' +
      '<div class="ends"><span>0 — строго</span><span>2 — свободно</span></div></div>' +
      '<div class="fld"><label>' + t('chat.len', 'Answer length') + ' <b id="mv">' + (curData.maxTokens || 512) + '</b></label>' +
      '<input type="range" id="mtok" min="64" max="4096" step="64" value="' + (curData.maxTokens || 512) + '">' +
      '<div class="ends"><span>64</span><span>4096</span></div></div>' +
      '<div id="sv"></div>' +
      '<div class="actions"><button class="btn" id="mcancel" type="button">Закрыть</button>' +
      '<button class="btn prim" id="msave" type="button">Сохранить</button></div>';
    $('mcancel').onclick = closeModal;
    $('temp').oninput = function () { $('tv').textContent = (+this.value).toFixed(1); };
    $('mtok').oninput = function () { $('mv').textContent = this.value; };
    $('msave').onclick = function () { saveCfg({ temperature: +$('temp').value, maxTokens: +$('mtok').value }); };
    return;
  }

  var w = snap(curData.imgWidth || 320), h = snap(curData.imgHeight || 480);
  if (h > MAX_D) h = MAX_D;
  var ratio = w / h;
  if (ratio < ASPECT_MIN) ratio = ASPECT_MIN;
  if (ratio > ASPECT_MAX) ratio = ASPECT_MAX;

  sheet.innerHTML = '<h3>' + t('chat.settings.bot.title', 'Bot settings') + '</h3>' +
    '<p class="h">Размер картинки. Тяните ползунок — вторая сторона подстраивается, чтобы кадр не стал слишком узким.</p>' +
    '<div class="chips" id="pchips"></div>' +
    '<div class="fld"><label>' + t('chat.width', 'Width') + ' <b id="wv">' + w + '</b></label>' +
    '<input type="range" id="sw" min="' + MIN_D + '" max="' + MAX_D + '" step="8" value="' + w + '">' +
    '<div class="ends"><span>' + MIN_D + '</span><span>' + MAX_D + '</span></div></div>' +
    '<div class="fld"><label>' + t('chat.height', 'Height') + ' <b id="hv">' + h + '</b></label>' +
    '<input type="range" id="sh" min="' + MIN_D + '" max="' + MAX_D + '" step="8" value="' + h + '">' +
    '<div class="ends"><span>' + MIN_D + '</span><span>' + MAX_D + '</span></div></div>' +
    '<div class="fld"><label>' + t('chat.steps', 'Steps') + ' <b id="stv">' + (curData.imgSteps || 10) + '</b></label>' +
    '<input type="range" id="st" min="4" max="24" step="1" value="' + (curData.imgSteps || 10) + '">' +
    '<div class="ends"><span>4 — быстро</span><span>24 — качество</span></div></div>' +
    '<div id="sv"></div>' +
    '<div class="actions"><button class="btn" id="mcancel" type="button">Закрыть</button>' +
    '<button class="btn prim" id="msave" type="button">Сохранить</button></div>';

  var chips = $('pchips');
  PRESETS.forEach(function (p) {
    var c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip';
    c.textContent = p.name + ' ' + p.w + '×' + p.h;
    c.onclick = function () {
      w = p.w; h = p.h;
      ratio = w / h;
      $('sw').value = w; $('sh').value = h;
      if ($('st')) $('st').value = p.steps;
      labels();
    };
    chips.appendChild(c);
  });

  function labels() {
    $('wv').textContent = w;
    $('hv').textContent = h;
    $('stv').textContent = $('st').value;
  }

  // связанные ползунки: двигаем одну сторону — вторая подстраивается по соотношению,
  // но и сама упирается в границы, чтобы кадр не стал слишком узким
  $('sw').oninput = function () {
    var want = snap(+this.value);
    var hh = snap(want / ratio);
    var ww = want;
    if (want / ratio > MAX_D) { hh = MAX_D; ww = snap(MAX_D * ratio); }
    else if (want / ratio < MIN_D) { hh = MIN_D; ww = snap(MIN_D * ratio); }
    w = ww; h = hh;
    $('sw').value = ww; $('sh').value = hh;
    labels();
  };
  $('sh').oninput = function () {
    var want = snap(+this.value);
    var ww = snap(want * ratio);
    var hh = want;
    if (want * ratio > MAX_D) { ww = MAX_D; hh = snap(MAX_D / ratio); }
    else if (want * ratio < MIN_D) { ww = MIN_D; hh = snap(MIN_D / ratio); }
    w = ww; h = hh;
    $('sw').value = ww; $('sh').value = hh;
    labels();
  };
  $('st').oninput = labels;
  $('mcancel').onclick = closeModal;
  $('msave').onclick = function () {
    saveCfg({ width: w, height: h, steps: +$('st').value });
  };
}

function saveCfg(extra) {
  var body = Object.assign({ id: cur.id }, extra);
  var btn = $('msave');
  var sv = $('sv');
  if (btn) { btn.disabled = true; btn.textContent = t("chat.saving", "saving…"); }
  if (sv) { sv.className = ''; sv.textContent = t("chat.sending.server", "sending to the server…"); }
  post('/__dialog/params', body, 20000).then(function (r) {
    var j = r.json || {};
    if (r.ok && j.ok !== false) {
      if (sv) { sv.className = 'good'; sv.textContent = t("chat.saved.here", "saved ✓ applies in this chat"); }
      if (btn) { btn.textContent = t("chat.saved", "Saved"); }
      return loadDialog().then(function () {
        setTimeout(function () { if ($('modal').className === 'on') { $('modal').className = ''; } }, 700);
      });
    }
    if (btn) { btn.disabled = false; btn.textContent = t("chat.save", "Save"); }
    if (sv) { sv.className = 'bad'; sv.textContent = j.error || (t('chat.err.save', 'not saved (HTTP ') + r.status + ')'); }
  }).catch(function () {
    if (btn) { btn.disabled = false; btn.textContent = t("chat.save", "Save"); }
    if (sv) { sv.className = 'bad'; sv.textContent = t("chat.err.conn.try", "connection dropped — try again"); }
  });
}

// ---------- удаление чата ----------
function removeChat(d) {
  if (!confirm(t('chat.del.file1', 'Delete “') + d.title + t('chat.del.file2', '”? The file goes to data\\trash on the server.'))) return;
  post('/__dialog/delete', { id: d.id }, 15000).then(function (r) {
    var j = r.json || {};
    if (!r.ok || j.ok === false) { toast(j.error || t("chat.err.delfile", "could not delete")); return; }
    toast(t("chat.deleted", "deleted"));
    if (cur && cur.id === d.id) {
      cur = null; curData = null;
      $('log').innerHTML = '';
      $('title').textContent = t("chat.pick.chat", "pick a conversation");
      $('cfg').disabled = true;
    }
    refreshDialogs();
  });
}

// ---------- мелочи ----------
function renderManage() {
  $('acct').onclick = function () { location.href = GH + '/account/'; };
  $('actback').onclick = function () {
    post('/__adm/act', { user: '' }, 10000).then(function () {
      actName = ''; showMe(); refreshDialogs();
      toast(t("chat.act.back.done", "you act as yourself again"));
    });
  };
  $('menu').onclick = function () { $('side').classList.toggle('hide'); };
  $('form').onsubmit = function (e) { e.preventDefault(); send(); };
  $('text').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $('text').addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, window.innerHeight * 0.4) + 'px';
  });
  $('file').onchange = function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (f) upload(f);
  };
  $('lretry').onclick = function () { hideLogin(); boot(); };
  $('newAI').onclick = function () { newAiChat(); };
  $('newPM').onclick = function () { newPmChat(); };
  $('cfg').onclick = openCfg;
}

// телефон: клавиатура не должна перекрывать ленту и поле ввода
var vv = window.visualViewport;
function fitViewport() {
  if (!vv) return;
  document.documentElement.style.height = Math.round(vv.height) + 'px';
  var log = $('log');
  if (log.scrollHeight - log.scrollTop - log.clientHeight < 160) log.scrollTop = log.scrollHeight;
}
if (vv) { vv.addEventListener('resize', fitViewport); vv.addEventListener('scroll', fitViewport); }

accInit();
boot();
})();
</script>
