<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#111417">
<title>AI &amp; Human · чат</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font:15px/1.45 -apple-system,'Segoe UI',Roboto,system-ui,sans-serif;background:#111417;color:#e6e9ee;display:flex;height:100dvh}
button,input,textarea,select{font:inherit}
a{color:#6aa9e6}
#side{width:272px;flex:0 0 272px;background:#161a1f;border-right:1px solid #262c34;display:flex;flex-direction:column;min-height:0}
#side.hide{display:none}
.brand{padding:12px 14px 8px;font-weight:600;letter-spacing:.2px}
.brand small{display:block;font-weight:400;color:#7c8794;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
#net{display:flex;align-items:center;gap:7px;padding:2px 14px 10px;color:#8b949e;font-size:12px}
#net .dot{width:8px;height:8px;border-radius:50%;background:#4a5260;flex:0 0 auto}
#net .dot.on{background:#4dbf74}

/* выпадающие разделы */
.acc{display:flex;flex-direction:column;min-height:0;border-top:1px solid #20262e}
.acc:first-of-type{border-top:0}
.acc .hd{display:flex;align-items:center;gap:7px;padding:9px 12px 7px;color:#7f8b99;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;user-select:none;min-height:38px}
.acc .hd:hover{color:#a8b4c2}
.acc .hd .tw{display:inline-block;width:12px;transition:transform .15s;color:#6d7885}
.acc.closed .hd .tw{transform:rotate(-90deg)}
.acc .hd .nm{flex:1}
.acc .hd button{background:#1d242c;border:1px solid #303a46;color:#a8b4c2;border-radius:8px;width:26px;height:26px;line-height:1;cursor:pointer;font-size:16px;padding:0}
.acc .hd button:hover{background:#26303a;color:#fff}
.acc .bd{overflow-y:auto;padding:0 8px 8px;min-height:0}
.acc.closed .bd{display:none}
#aiAcc .bd{max-height:44vh}
#pmAcc .bd{flex:1 1 auto;max-height:none}

.it{display:flex;gap:8px;align-items:center;padding:8px 8px;border-radius:9px;cursor:pointer;color:#dfe3e8;position:relative}
.it:hover{background:#1e232a}
.it.on{background:#223040;outline:1px solid #33506e}
.it .ic{width:20px;text-align:center;flex:0 0 20px;color:#8ea3b8}
.it .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .sub{color:#7c8794;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .dot{width:7px;height:7px;border-radius:50%;background:#4a5260;flex:0 0 auto}
.it .dot.on{background:#4dbf74}
.it .del{display:none;background:none;border:0;color:#6f7a87;font-size:15px;padding:2px 4px;border-radius:6px;cursor:pointer;flex:0 0 auto}
.it:hover .del{display:block}
.it .del:hover{color:#ff9d9d;background:#2a1c1e}
@media (hover:none){ .it .del{display:block;color:#5b6672} }

#me{margin-top:auto;border-top:1px solid #262c34;padding:10px 12px;display:flex;gap:8px;align-items:center;color:#9aa4b0;font-size:13px;min-height:52px}
#me .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#me button{background:#1d232b;border:1px solid #303842;color:#9aa4b0;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:12px}
#actb{display:none;align-items:center;gap:8px;padding:6px 10px;background:#4a3a12;color:#ffe6ad;font-size:12.5px;border-bottom:1px solid #6b5520}
#actb.on{display:flex}
#actb span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#actb button{background:#2b2415;border:1px solid #6b5520;color:#ffe6ad;border-radius:8px;padding:3px 9px;cursor:pointer;white-space:nowrap}

main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #262c34;background:#14181c;min-height:52px}
#menu{display:none;background:none;border:0;color:#c9d1d9;font-size:20px;cursor:pointer;padding:0 4px}
#title{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hint{color:#7c8794;font-size:12px}
#cfg{background:#1d232b;border:1px solid #303842;color:#b9c4d0;border-radius:9px;padding:5px 9px;cursor:pointer;font-size:15px;line-height:1}
#cfg:disabled{opacity:.35;cursor:default}

#log{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:8px;min-height:0;overscroll-behavior:contain}
.m{max-width:min(640px,86%);padding:8px 11px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:#2b5f96;color:#f2f7ff;border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:#1c2229;color:#e6e9ee;border-bottom-left-radius:4px}
.m.th{align-self:flex-start;background:#1a2129;color:#9fb3c8;font-size:13.5px}
.m.pend{opacity:.5}
.m.err{box-shadow:0 0 0 1px #b4453c inset;cursor:pointer}
.m.e{align-self:flex-start;background:#3a2020;color:#ffb4b4;font-size:13.5px}
.m .who{font-size:11.5px;color:#8fb8e0;margin-bottom:3px}
.m .tm{font-size:10.5px;color:#789;margin-left:6px}
.m img{max-width:100%;border-radius:8px;display:block;margin-top:6px;cursor:zoom-in;background:#0d1013;min-height:40px}
.m .mimg{position:relative}
.m .shr{position:absolute;right:6px;top:6px;background:rgba(12,16,20,.72);color:#cfe3ff;border:0;border-radius:8px;padding:3px 7px;font-size:12px;cursor:pointer}
.m .dl{position:absolute;right:6px;bottom:6px;background:rgba(12,16,20,.72);color:#cfe3ff;border-radius:8px;padding:3px 8px;font-size:13px;text-decoration:none}
.m .dl:hover,.m .shr:hover{background:rgba(40,80,140,.9)}
#typing{display:none;padding:2px 14px 6px;color:#8b949e;font-size:12.5px}
#typing.on{display:block}
#form{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #262c34;background:#14181c}
#clip{flex:0 0 auto;width:42px;height:40px;border-radius:10px;background:#1d232b;border:1px solid #303842;color:#9aa4b0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:19px}
#text{flex:1;min-height:40px;max-height:40vh;resize:none;background:#1b2027;color:#e6e9ee;border:1px solid #2c333d;border-radius:11px;padding:9px 11px;outline:none;font-size:16px}
#send{flex:0 0 auto;width:44px;height:40px;border-radius:10px;border:0;background:#2f6fb5;color:#fff;font-size:17px;cursor:pointer}
#send:disabled{opacity:.45}
#send.busy{background:#5a4a22}

/* модальные окна: снизу на телефоне, по центру на ПК */
#modal{position:fixed;inset:0;background:#0b0e12cc;display:none;align-items:flex-end;justify-content:center;z-index:25}
#modal.on{display:flex}
#modal .sheet{background:#171c22;border:1px solid #2a323c;border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:760px){ #modal{align-items:center} #modal .sheet{border-radius:16px} }
#modal h3{margin:0 0 4px;font-size:16px}
#modal p.h{margin:0 0 12px;color:#8b949c;font-size:12.5px}
.mlist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto}
.mi{display:flex;gap:9px;align-items:center;padding:10px 11px;border:1px solid #262f39;border-radius:10px;background:#141920;cursor:pointer}
.mi:hover{background:#1b222b}
.mi.on{outline:1px solid #35567a;background:#1d2733}
.mi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .t small{display:block;color:#7b8794;font-size:11.5px}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1}
.btn{background:#1d242c;border:1px solid #303a46;color:#dfe3e8;border-radius:10px;padding:11px 14px;cursor:pointer;min-height:44px}
.btn.prim{background:#2f6fb5;border-color:#3f81c9;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 4px}
.chip{background:#1a2129;border:1px solid #303a46;color:#b9c4d0;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px}
.chip.on{background:#25384f;border-color:#3f6390;color:#fff}
.fld{margin:10px 0 2px}
.fld label{display:flex;justify-content:space-between;font-size:12.5px;color:#8b949c;margin-bottom:4px}
.fld label b{color:#dfe3e8;font-variant-numeric:tabular-nums}
.fld input[type=range]{width:100%;accent-color:#2f6fb5;height:30px}
.fld .ends{display:flex;justify-content:space-between;color:#5f6a77;font-size:11px;margin-top:-4px}
#sv{color:#9aa4b0;font-size:12.5px;margin-top:10px;min-height:18px}
#sv.bad{color:#ffb4b4}
#sv.good{color:#9ee2b4}

#login{position:fixed;inset:0;background:#0e1114ee;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:30}
#login.on{display:flex}
#login .box{max-width:420px}
#login h1{font-size:19px;margin:0 0 8px}
#login p{color:#9aa4b0;margin:0 0 16px;font-size:14px}
#login a.btn{display:inline-block;background:#2f6fb5;color:#fff;text-decoration:none;padding:11px 18px;border-radius:10px;font-weight:600}
#login .retry{display:block;margin:14px auto 0;background:none;border:0;color:#7c8794;cursor:pointer;font-size:13px;text-decoration:underline}

#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#232b35;border:1px solid #3a4552;color:#e6e9ee;border-radius:10px;padding:9px 14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:40;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  #side{position:fixed;inset:0 auto 0 0;z-index:20;box-shadow:0 0 0 100vmax #0009}
  #side.hide{display:none}
  #menu{display:block}
  #hint{display:none}
}
</style>
</head>
<body>

<aside id="side">
  <div class="brand">AI &amp; Human<small>мессенджер</small></div>
  <div id="net"><span class="dot" id="ndot"></span><span id="ntext">ищу сервер…</span></div>

  <div class="acc" id="aiAcc">
    <div class="hd"><span class="tw">▾</span><span class="nm">ИИ чаты</span><button type="button" id="newAI" title="новый чат с ботом">＋</button></div>
    <div class="bd" id="aiList"></div>
  </div>

  <div class="acc" id="pmAcc">
    <div class="hd"><span class="tw">▾</span><span class="nm">Люди</span><button type="button" id="newPM" title="новый диалог с человеком">＋</button></div>
    <div class="bd" id="pmList"></div>
  </div>

  <div id="me"><span class="nm" id="mename">…</span><button id="acct" type="button">аккаунт</button></div>
</aside>

<main>
  <div id="actb"><span id="actt"></span><button type="button" id="actback">вернуться к себе</button></div>
  <header>
    <button id="menu" type="button" aria-label="меню">☰</button>
    <div id="title">выберите переписку</div>
    <div id="hint"></div>
    <button id="cfg" type="button" aria-label="настройки бота" title="настройки бота" disabled>⚙</button>
  </header>
  <div id="log"></div>
  <div id="typing">ИИ думает…</div>
  <form id="form" autocomplete="off">
    <label id="clip" title="Прикрепить картинку">＋<input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label>
    <textarea id="text" rows="1" placeholder="Сообщение…"></textarea>
    <button id="send" type="submit" aria-label="отправить">➤</button>
  </form>
</main>

<div id="login"><div class="box">
  <h1 id="lht">Нужен вход</h1>
  <p id="lmsg">Страница чата живёт на GitHub, а переписка — на вашем домашнем ПК.</p>
  <a class="btn" id="lgo" href="/accounts/">Войти</a>
  <button class="retry" id="lretry" type="button">Проверить связь ещё раз</button>
</div></div>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
(function () {
'use strict';

// ---------- постоянные адреса ----------
var REPO  = 'dperegudov61/dperegudov61.github.io';
var API   = 'https://api.github.com/repos/' + REPO + '/contents/status.json';
var RAW   = 'https://raw.githubusercontent.com/' + REPO + '/main/status.json';
var LOCAL = 'https://dperegudov61.github.io/status.json';
var GH    = 'https://dperegudov61.github.io';
var PAGEURL = location.origin + location.pathname;
var TOK   = 'door.token';
var URLKEY = 'door.url';
var STALE_MIN = 60;

var $ = function (id) { return document.getElementById(id); };
var base = '', tok = '', me = '', realMe = '', actName = '', admin = false;
var dialogs = [], people = [], models = [], cur = null, curData = null;
var busy = false, lastCount = -1, bootT = 0;

function ls(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lss(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsd(k) { try { localStorage.removeItem(k); } catch (e) {} }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
  return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]; }); }

var toastT = 0;
function toast(text) {
  var el = $('toast');
  el.textContent = text;
  el.className = 'on';
  clearTimeout(toastT);
  toastT = setTimeout(function () { el.className = ''; }, 2600);
}

// ---------- сеть ----------
function timeout(ms) {
  var ctl = new AbortController();
  var t = setTimeout(function () { ctl.abort(); }, ms);
  return { signal: ctl.signal, done: function () { clearTimeout(t); } };
}
function fetchJSON(url, opt, ms) {
  var tm = timeout(ms || 8000);
  return fetch(url, Object.assign({ cache: 'no-store', signal: tm.signal }, opt || {}))
    .then(function (r) {
      tm.done();
      return r.text().then(function (txt) {
        var j = {};
        try { j = JSON.parse(txt || '{}'); } catch (e) {}
        return { status: r.status, ok: r.ok, json: j };
      });
    })
    .catch(function () { tm.done(); return { status: 0, ok: false, json: {} }; });
}
function api(path, opt) {
  opt = opt || {};
  var h = Object.assign({ 'Authorization': 'Bearer ' + tok }, opt.headers || {});
  return fetchJSON(base + path, { method: opt.method || 'GET', headers: h, body: opt.body }, opt.ms || 20000);
}
function post(path, obj, ms) {
  return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(obj || {}), ms: ms || 20000 });
}

// ---------- status.json: где сейчас живёт сервер ----------
function b64ToText(b64) {
  var bin = atob(String(b64).replace(/\s/g, ''));
  var n = bin.length, bytes = new Uint8Array(n), i;
  for (i = 0; i < n; i++) bytes[i] = bin.charCodeAt(i);
  if (window.TextDecoder) return new TextDecoder('utf-8').decode(bytes);
  var s = '';
  for (i = 0; i < n; i++) s += String.fromCharCode(bytes[i]);
  return decodeURIComponent(escape(s));
}
function statusFrom(r) {
  if (!r || !r.ok) return null;
  var j = r.json || {};
  if (typeof j.content === 'string' && j.encoding === 'base64') {
    try { j = JSON.parse(b64ToText(j.content)); } catch (e) { return null; }
  }
  return (j && (typeof j.url === 'string' || j.connections)) ? j : null;
}
function connsOf(j) {
  var out = [], arr = j && j.connections, i;
  if (Object.prototype.toString.call(arr) === '[object Array]') {
    for (i = 0; i < arr.length; i++) {
      var c = arr[i] || {};
      if (typeof c.url !== 'string' || !c.url) continue;
      out.push({ url: c.url.replace(/\/+$/, ''), updated: Date.parse(c.created || '') || 0 });
    }
  }
  if (!out.length && j && typeof j.url === 'string' && j.url)
    out.push({ url: j.url.replace(/\/+$/, ''), updated: Date.parse(j.updated || '') || 0 });
  return out;
}
function statusList() {
  var bust = '?v=' + Date.now();
  var reqs = [ fetchJSON(API, { headers: { 'Accept': 'application/vnd.github+json' } }, 7000),
               fetchJSON(LOCAL + bust, null, 5000),
               fetchJSON(RAW + bust, null, 7000) ];
  return Promise.all(reqs).then(function (res) {
    var seen = {}, out = [], i, k;
    for (i = 0; i < res.length; i++) {
      var list = connsOf(statusFrom(res[i]));
      for (k = 0; k < list.length; k++) {
        var u = list[k].url;
        if (seen[u]) { if (list[k].updated > seen[u].updated) seen[u].updated = list[k].updated; continue; }
        seen[u] = list[k];
      }
    }
    for (var key in seen) if (Object.prototype.hasOwnProperty.call(seen, key)) out.push(seen[key]);
    var mem = ls(URLKEY);
    if (mem && !seen[mem]) out.push({ url: mem, updated: -1 });
    out.sort(function (a, b) { return b.updated - a.updated; });
    var now = Date.now();
    var fresh = out.filter(function (x) { return x.updated <= 0 || (now - x.updated) / 60000 <= STALE_MIN; });
    var stale = out.filter(function (x) { return x.updated > 0 && (now - x.updated) / 60000 > STALE_MIN; });
    return fresh.concat(stale);
  });
}
function ping(url) {
  if (!url) return Promise.resolve(false);
  return fetchJSON(url + '/__door/hi', null, 6000).then(function (r) {
    return !!(r.ok && r.json && r.json.ok === true);
  });
}
function firstLive(urls) {
  return new Promise(function (resolve) {
    if (!urls.length) { resolve(''); return; }
    var left = urls.length, done = false;
    urls.forEach(function (u) {
      ping(u).then(function (alive) {
        left--;
        if (alive && !done) { done = true; resolve(u); }
        else if (left === 0 && !done) { done = true; resolve(''); }
      });
    });
  });
}
function findLive() {
  var mem = ls(URLKEY);
  var quick = mem ? [mem] : [];
  var slow = statusList().then(function (list) { return list.map(function (x) { return x.url; }); });
  return new Promise(function (resolve) {
    var done = false, pending = 2;
    function hit(u) {
      if (done) return;
      if (u) { done = true; resolve(u); return; }
      if (--pending === 0) { done = true; resolve(''); }
    }
    firstLive(quick).then(hit);
    slow.then(firstLive).then(hit);
  });
}

function net(on, text) {
  $('ndot').className = 'dot' + (on ? ' on' : '');
  $('ntext').textContent = text;
}

// ---------- вход ----------
function showLogin(title, msg) {
  $('lht').textContent = title || 'Нужен вход';
  $('lmsg').textContent = msg || 'Страница чата живёт на GitHub, а переписка — на вашем домашнем ПК.';
  $('lgo').href = GH + '/accounts/?next=' + encodeURIComponent(PAGEURL);
  $('login').className = 'on';
}
function hideLogin() { $('login').className = ''; }

function takeTokenFromUrl() {
  var m = /[?&]tk=([^&]+)/.exec(location.search);
  if (!m) return '';
  var t = '';
  try { t = decodeURIComponent(m[1]); } catch (e) { return ''; }
  if (t) {
    // ?tk=<ключ> — это быстрый ключ устройства (так работает ссылка из админки),
    // а не сеанс: кладём его в door.key, а страница сама обменяет его на токен
    // через /__door/auth. Сеанс от прежнего входа сразу забываем.
    lss('door.key', t);
    lsd(TOK);
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }
  return '';
}

// личная ссылка вида /AI-Human-Messenger/<ключ> (её отдаёт 404.html — копия страницы):
// ключ из пути становится быстрым ключом устройства и стирается из адреса
function takeKeyFromPath() {
  var p = location.pathname || '';
  var m = /^\/AI-Human-Messenger\/([A-Za-z0-9_-]{16,64})\/?$/.exec(p);
  if (!m) return '';
  lss('door.key', m[1]);
  try { history.replaceState(null, '', '/AI-Human-Messenger/'); } catch (e) {}
  return m[1];
}

function boot(retry) {
  retry = retry || 0;
  clearTimeout(bootT);
  net(false, 'ищу сервер…');
  takeKeyFromPath();
  var local = /^(127\.0\.0\.1|localhost)$/i.test(location.hostname);
  var ready = local ? Promise.resolve(location.origin) : findLive();
  ready.then(function (url) {
    if (!url) {
      net(false, 'сервер не отвечает');
      showLogin('Сервер не на связи', 'Включите ПК (окно «2. Сервер») — страница сама найдёт новый адрес моста.');
      // пробуем сами, пока не найдём: 2,5 → 15 с (без кнопок и перезагрузок)
      bootT = setTimeout(function () { boot(retry + 1); }, Math.min(15000, 2500 * Math.pow(1.4, Math.min(retry, 8))));
      return;
    }
    base = url.replace(/\/+$/, '');
    if (!local) lss(URLKEY, base);
    net(true, 'сервер на связи');
    tok = takeTokenFromUrl() || ls(TOK);
    return verify().then(function (ok) {
      if (ok) { hideLogin(); return start(); }
      var key = ls('door.key');
      if (!key) { showLogin(); return; }
      return post('/__door/auth', { key: key }).then(function (r) {
        var j = r.json || {};
        if (r.ok && j.ok && j.token) {
          tok = j.token; lss(TOK, tok);
          return verify().then(function (ok2) {
            if (ok2) { hideLogin(); start(); }
            else showLogin('Вход больше не действует', 'Ключ этого устройства не принят — войдите заново.');
          });
        }
        // Мост мог сменить адрес посреди работы: связь оборвалась — ключ НЕ стираем,
        // а ищем сервер заново. Ключ гасим только при явном отказе (401/403).
        if (r.status === 0) {
          showLogin('Связь оборвалась', 'Страница ищет новый адрес моста — подождите пару секунд или нажмите «Проверить связь ещё раз».');
          if (retry < 1) setTimeout(function () { boot(retry + 1); }, 2500);
          return;
        }
        lsd('door.key');
        showLogin('Вход больше не действует', 'Ключ этого устройства не принят — войдите заново.');
      });
    });
  });
}

function verify() {
  if (!tok) return Promise.resolve(false);
  return api('/__me', { ms: 9000 }).then(function (r) {
    var j = r.json || {};
    if (r.ok && (j.user || j.ok)) {
      me = j.user || '';
      realMe = j.real || me;
      actName = j.act || '';
      admin = !!j.admin;
      lss('door.user', me);
      return true;
    }
    if (r.status === 401 || r.status === 403) { lsd(TOK); tok = ''; }
    return false;
  });
}

function start() {
  showMe();
  renderManage();
  loadModels();
  refreshDialogs();
  loadPeople();
  channel();          // канал событий: вместо опроса диалога каждые 6 секунд
}

// «Сергей (Дима Администратор)» — кто на самом деле держит сессию
function showMe() {
  var nm = actName || me;
  $('mename').textContent = (actName && realMe && actName !== realMe)
    ? actName + ' (' + realMe + ' Администратор)'
    : nm;
  if (actName && actName !== realMe) {
    $('actb').className = 'on';
    $('actt').textContent = 'вы действуете от имени «' + actName + '»';
  } else {
    $('actb').className = '';
  }
}

function refreshDialogs() {
  return api('/__boot', { ms: 20000 }).then(function (r) {
    var j = r.json || {};
    if (j.user) { me = j.user; }
    realMe = j.real || realMe;
    actName = j.act || '';
    admin = !!j.admin;
    showMe();
    dialogs = j.dialogs || [];
    if (!cur) {
      var want = pickStart();
      if (want) open(want);
    }
    renderAll();
  });
}

function pickStart() {
  var shared = null, best = null;
  dialogs.forEach(function (d) {
    if (d.shared) shared = d;
    else if (!best) best = d;
  });
  return best || shared;
}

function isPm(d) { return d.kind === 'pm' || d.shared; }
function isAiChat(d) { return !d.shared && d.kind !== 'pm'; }

function iconOf(d) {
  if (d.shared) return '👥';
  if (d.kind === 'pm') return '✉';
  return d.model ? '💬' : '·';
}
function titleOf(d) {
  if (d.shared) return 'Общий чат';
  if (d.title && d.title !== 'Новый чат' && d.title !== 'без названия') return d.title;
  if (d.kind === 'pm') return d.peer || 'личная переписка';
  return d.title || 'Новый чат';
}
function subOf(d) {
  var bits = [];
  if (d.shared) bits.push('общий чат');
  else if (d.kind === 'pm') bits.push('личная переписка');
  else bits.push(d.model || 'ИИ');
  if (d.count) bits.push(d.count + ' сообщ.');
  return bits.join(' · ');
}

function renderAll() {
  renderList('aiList', dialogs.filter(isAiChat), 'пока нет чатов с ИИ — нажмите ＋');
  renderList('pmList', dialogs.filter(isPm), 'пока нет людей — нажмите ＋');
}

function renderList(boxId, list, empty) {
  var box = $(boxId);
  box.innerHTML = '';
  list.forEach(function (d) {
    var el = document.createElement('div');
    el.className = 'it' + (cur && cur.id === d.id ? ' on' : '');
    el.innerHTML = '<span class="ic">' + iconOf(d) + '</span><span class="tt">' + esc(titleOf(d)) +
      '<div class="sub">' + esc(subOf(d)) + '</div></span>' +
      (d.shared ? '' : '<button class="del" type="button" title="удалить">✕</button>');
    el.onclick = function () { open(d); };
    var del = el.querySelector('.del');
    if (del) del.onclick = function (ev) { ev.stopPropagation(); removeChat(d); };
    box.appendChild(el);
  });
  if (!list.length) {
    var e = document.createElement('div');
    e.className = 'it';
    e.innerHTML = '<span class="tt" style="color:#7c8794">' + esc(empty) + '</span>';
    box.appendChild(e);
  }
}

// свернуть/развернуть разделы — состояние запоминается
function accInit() {
  ['aiAcc', 'pmAcc'].forEach(function (id) {
    var el = $(id);
    var st = ls('acc.' + id);
    if (st === '0') el.className = 'acc closed';
    el.querySelector('.hd').onclick = function (ev) {
      if (ev.target.tagName === 'BUTTON') return;
      var closed = el.className.indexOf('closed') >= 0;
      el.className = 'acc' + (closed ? '' : ' closed');
      lss('acc.' + id, closed ? '1' : '0');
    };
  });
}

function loadPeople() {
  return api('/__people', { ms: 12000 }).then(function (r) {
    people = (r.json || {}).people || [];
  });
}

function loadModels() {
  if (models.length) return Promise.resolve(models);
  return api('/__models', { ms: 15000 }).then(function (r) {
    models = (r.json && r.json.models) || (r.json || []) || [];
    return models;
  });
}

// ---------- переписка ----------
function open(d) {
  cur = d; lastCount = -1;
  $('title').textContent = titleOf(d);
  $('hint').textContent = d.kind === 'pm' ? 'личная переписка' : d.shared ? 'общий чат' : (d.model || '');
  if (window.innerWidth <= 820) $('side').className = 'hide';
  renderAll();
  $('log').innerHTML = '';
  loadDialog();
  setTimeout(function () { $('text').focus(); }, 80);
}

function loadDialog() {
  return api('/__dialog?id=' + encodeURIComponent(cur.id), { ms: 20000 }).then(function (r) {
    var j = r.json || {};
    if (!j.id) return;
    curData = j;
    if (j.title && j.title !== cur.title) { cur.title = j.title; $('title').textContent = j.title; }
    $('cfg').disabled = !isAiDialog();
    lastCount = (j.messages || []).length;
    drawMessages(j.messages || []);
  });
}

function imageSrc(link, small) {
  if (!link) return '';
  return base + link + '?v=' + (small ? 'small' : 'full') + '&tk=' + encodeURIComponent(tok);
}

// полный файл как скачивание: имя берётся из паспорта на сервере
function fileDownload(link) {
  if (!link) return '#';
  return base + link + (link.indexOf('?') >= 0 ? '&' : '?') + 'raw=1&dl=1&tk=' + encodeURIComponent(tok);
}

// один элемент сообщения (и для полной отрисовки, и для догрузки дельты)
function msgEl(m) {
  var mine = (me || '').toLowerCase();
  var el = document.createElement('div');
    var own = m.role === 'user' && (!m.author || m.author.toLowerCase() === mine);
    el.className = 'm ' + (m.role === 'assistant' ? (m.content.indexOf('⏹') === 0 ? 'th' : 'a') : (own ? 'u' : 'a'));
    if (m.author && !own) {
      var w = document.createElement('div');
      w.className = 'who';
      w.textContent = m.author;
      el.appendChild(w);
    }
    if (m.content) {
      var t = document.createElement('div');
      t.textContent = m.content;
      el.appendChild(t);
    }
    if (m.image && m.link) {
      var wrap = document.createElement('div');
      wrap.className = 'mimg';
      var im = document.createElement('img');
      im.loading = 'lazy';
      im.alt = 'картинка';
      // progressive JPEG: браузер рисует его по мере прихода байтов
      im.src = imageSrc(m.link, true);
      im.onclick = function () { window.open(imageSrc(m.link, false), '_blank'); };
      im.onerror = function () { this.onerror = null; this.src = imageSrc(m.link, false); };
      wrap.appendChild(im);
      // оригинал — линейкой: изначальное название сохраняется в паспорте файла
      var dl = document.createElement('a');
      dl.className = 'dl';
      dl.title = 'скачать оригинал (как загружено)';
      dl.textContent = '⬇';
      dl.href = fileDownload(m.link);
      dl.setAttribute('download', '');
      wrap.appendChild(dl);
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'shr';
      b.title = 'поделиться картинкой';
      b.textContent = '🔗';
      b.onclick = function () { shareImage(m.link); };
      wrap.appendChild(b);
      el.appendChild(wrap);
  }
  return el;
}

function drawMessages(msgs) {
  var log = $('log');
  log.innerHTML = '';
  msgs.forEach(function (m) { log.appendChild(msgEl(m)); });
  log.scrollTop = log.scrollHeight;
}

// добавить только новые сообщения — без перерисовки всего и без прыжка прокрутки
function appendMessages(msgs) {
  var log = $('log');
  var near = (log.scrollHeight - log.scrollTop - log.clientHeight) < 120;
  msgs.forEach(function (m) { log.appendChild(msgEl(m)); });
  if (near) log.scrollTop = log.scrollHeight;
}

// ---------- отправка ----------
function isAiDialog() { return !!(curData && curData.model && !curData.shared && curData.kind !== 'pm'); }

function setBusy(on, text) {
  busy = on;
  $('send').className = on ? 'busy' : '';
  $('typing').className = on ? 'on' : '';
  if (text) $('typing').textContent = text;
}

function send() {
  var textEl = $('text');
  var q = textEl.value.trim();
  if (!q || !cur || busy) return;
  textEl.value = '';
  if (isAiDialog()) return sendAi(q);
  setBusy(true, 'отправляю…');
  var cid = newCid();
  var pending = pendingEl(q);
  deliver(cur.id, q, cid, pending, 0);
}

// ключ сообщения: повтор после обрыва не задваивает запись (сервер помнит cid)
function newCid() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

// сообщение видно сразу, полупрозрачным, до подтверждения сервером
function pendingEl(text) {
  var log = $('log');
  var el = document.createElement('div');
  el.className = 'm u pend';
  var t = document.createElement('div');
  t.textContent = text;
  el.appendChild(t);
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function deliver(id, text, cid, pending, tryN) {
  post('/__msg', { id: id, text: text, cid: cid }, 20000).then(function (r) {
    if (r.ok) {
      setBusy(false);
      if (pending && pending.parentNode) pending.parentNode.removeChild(pending);
      if (cur && cur.id === id) {
        if (lastCount >= 0) loadDelta(); else loadDialog();
      }
      return;
    }
    // ответ мог потеряться уже после записи на диск — повторяем с тем же cid
    if ((r.status === 0 || r.status >= 500) && tryN < 2) {
      setTimeout(function () { deliver(id, text, cid, pending, tryN + 1); }, 2500);
      return;
    }
    setBusy(false);
    if (pending) {
      pending.className = 'm u err';
      pending.title = 'не отправлено — нажмите, чтобы повторить';
      pending.onclick = function () {
        if (pending.parentNode) pending.parentNode.removeChild(pending);
        var again = pendingEl(text);
        setBusy(true, 'отправляю…');
        deliver(id, text, cid, again, 0);
      };
    }
    toast((r.json || {}).error || (r.status ? 'не отправилось (HTTP ' + r.status + ')' : 'нет связи — нажмите на сообщение, чтобы повторить'));
  });
}

function sendAi(q) {
  setBusy(true, 'ИИ думает…');
  var d = curData || {};
  var msgs = [];
  if (d.systemPrompt) msgs.push({ role: 'system', content: d.systemPrompt });
  (d.messages || []).forEach(function (m) { if (m.content) msgs.push({ role: m.role, content: m.content }); });
  msgs.push({ role: 'user', content: q });
  drawMessages((d.messages || []).concat([{ role: 'user', content: q }]));
  fetchJSON(base + '/v1/chat/completions', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json', 'X-Chat-Id': cur.id },
    body: JSON.stringify({ messages: msgs, stream: false, max_tokens: d.maxTokens || 512, temperature: d.temperature || 0.7 })
  }, 300000).then(function (r) {
    var j = r.json || {};
    var acc = '';
    try { acc = j.choices[0].message.content || ''; } catch (e) {}
    if (r.status === 503) throw new Error('модель сейчас загружается — попробуйте через полминуты');
    if (!r.ok || !acc) throw new Error((j.error && (j.error.message || j.error)) || ('ответа нет (HTTP ' + r.status + ')'));
    var hist = (d.messages || []).concat([{ role: 'user', content: q }, { role: 'assistant', content: acc }]);
    return post('/__log', { id: cur.id, user: q, assistant: acc, messages: hist }, 30000).then(function () { loadDialog(); });
  }).catch(function (e) {
    net(false, 'связь оборвалась');
    setBusy(false);
    $('text').value = q;
    toast('Не получилось: ' + (e && e.message ? e.message : e));
    setTimeout(function () { net(true, 'сервер на связи'); loadDialog(); }, 2500);
  }).then(function () { setBusy(false); });
}

// ---------- картинки ----------
function shareImage(link) {
  var id = String(link || '').split('/').pop();
  if (!id) return;
  post('/__img/share', { id: id }, 15000).then(function (r) {
    var j = r.json || {};
    if (!r.ok || !j.ok) { toast(j.error || 'не получилось'); return; }
    var full = base + j.path;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full).then(function () { toast('ключ-ссылка скопирована'); },
        function () { toast('ссылка: ' + full); });
    } else toast('ссылка: ' + full);
  });
}

// sha256 содержимого на клиенте: если такой файл уже есть, грузить нечего
function sha256hex(buf) {
  if (!window.crypto || !crypto.subtle) return Promise.resolve('');
  try {
    return crypto.subtle.digest('SHA-256', buf).then(function (h) {
      var b = new Uint8Array(h), s = '';
      for (var i = 0; i < b.length; i++) s += (b[i] < 16 ? '0' : '') + b[i].toString(16);
      return s;
    }).catch(function () { return ''; });
  } catch (e) { return Promise.resolve(''); }
}

function upload(file) {
  if (!file || !cur) return;
  if (file.size > 24 * 1024 * 1024) { toast('Файл больше 24 МБ'); return; }
  setBusy(true, 'считаю хеш…');
  var reader = new FileReader();
  reader.onload = function () {
    sha256hex(reader.result).then(function (sha) {
      if (!sha) { sendFile(file, ''); return; }
      // такой файл уже есть? тогда не грузим — показываем готовый
      post('/__file/check', { sha: sha }, 15000).then(function (r) {
        var j = r.json || {};
        if (r.ok && j.exists && j.file && j.file.id) {
          post('/__file/link', { file: j.file.id, chat: cur.id }, 15000).then(function (r2) {
            setBusy(false);
            if (!r2.ok) { toast((r2.json || {}).error || 'не получилось показать файл'); return; }
            toast('такой файл уже был — показан без загрузки');
            loadDialog();
          });
          return;
        }
        sendFile(file, sha);
      }).catch(function () { sendFile(file, sha); });
    });
  };
  reader.onerror = function () { setBusy(false); toast('не смог прочитать файл'); };
  reader.readAsArrayBuffer(file);
}

// сама отправка байтов, с процентом загрузки (fetch прогресс не показывает)
function sendFile(file, sha) {
  if (!cur) return;
  var q = '/__file/upload?name=' + encodeURIComponent(file.name) + '&id=' + encodeURIComponent(cur.id) +
          (sha ? '&sha=' + sha : '');
  var xhr = new XMLHttpRequest();
  xhr.open('POST', base + q, true);
  xhr.setRequestHeader('Authorization', 'Bearer ' + tok);
  xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
  xhr.upload.onprogress = function (e) {
    if (e.lengthComputable && e.total > 0)
      setBusy(true, 'загружаю ' + Math.round(100 * e.loaded / e.total) + '%');
  };
  xhr.onload = function () {
    setBusy(false);
    var j = {};
    try { j = JSON.parse(xhr.responseText || '{}'); } catch (e) {}
    if (xhr.status !== 200) { toast(j.error || 'не загрузилось'); return; }
    if (j.dup) toast('такой файл уже был — показан готовый');
    loadDialog();
  };
  xhr.onerror = function () { setBusy(false); toast('нет связи'); };
  setBusy(true, 'загружаю…');
  xhr.send(file);
}

// ---------- канал событий ----------
// Сервер держит запрос до 25 с и отвечает сразу, как только что-то случилось.
// Событие — уведомление: {s: номер, k: вид, c: диалог, a: кто, n: сколько сообщений}.
// Сами сообщения забираем дельтой /__dialog?after=N — сотни байт вместо всего диалога.
var chSeq = 0, chDown = 0, chBusy = false, chTimer = 0, chWait = 25, chOn = false;
var listT = 0, peopleT = 0, deltaBusy = false, deltaAgain = false;

function channel() {
  if (chOn) return;   // один канал на страницу
  chOn = true;
  chSeq = Number(ls('ch.seq') || 0) || 0;
  chDown = 0;
  poll();
}

function poll() {
  clearTimeout(chTimer);
  if (!base || !tok || chBusy) return;
  chBusy = true;
  var t0 = Date.now();
  post('/__events', { since: chSeq, wait: chWait }, 40000).then(function (r) {
    chBusy = false;
    var j = r.json || {};
    if (r.status === 401 || r.status === 403) {
      lsd(TOK); tok = '';
      showLogin('Вход больше не действует', 'Войдите заново — ключ или пароль устарели.');
      return;
    }
    var ok = r.ok && typeof j.seq === 'number';
    var wait = 0;
    if (ok) {
      chDown = 0;
      chWait = 25;
      net(true, 'сервер на связи');
      if (j.reset) resync();
      chSeq = j.seq;
      lss('ch.seq', String(chSeq));
      var list = j.events || [];
      for (var i = 0; i < list.length; i++) onEvent(list[i]);
      if (!list.length && Date.now() - t0 < 800) wait = 800;   // не крутимся вхолостую
    } else {
      chDown++;
      // если туннель рвёт долгие запросы — держим короче, чтобы не молотить вхолостую
      if (chDown >= 3 && chWait > 12) chWait = 12;
      // 404 = сервер старой сборки (в нём ещё нет /__events)
      if (r.status === 404) net(false, 'сервер старой версии — перезапустите окно «1. Нейросети»');
      else net(false, chDown > 2 ? 'связь оборвалась — ищу мост' : 'восстанавливаю связь…');
      if (chDown === 2) refind();
      wait = Math.min(15000, 800 * Math.pow(2, Math.min(chDown, 4)));
    }
    chTimer = setTimeout(poll, wait);
  });
}

// новый адрес моста (туннель перезапускается сам и меняет адрес)
function refind() {
  // локальная проверка: адрес задан браузером, искать мост не нужно
  if (/^(127\.0\.0\.1|localhost)$/i.test(location.hostname)) return;
  findLive().then(function (u) {
    if (!u) return;
    u = u.replace(/\/+$/, '');
    if (u !== base) { base = u; lss(URLKEY, base); }
  });
}

// сервер перезапустился или мы слишком долго были без связи — полная сверка
function resync() {
  refreshDialogs();
  loadPeople();
  if (cur) loadDialog();   // могли прийти сообщения, пока нас не было
}

function onEvent(e) {
  var k = (e && e.k) || '';
  if (k === 'msg' || k === 'img') {
    if (cur && e.c === cur.id) {
      if (typeof e.n === 'number' && lastCount >= 0 && e.n > lastCount) loadDelta();
      else if (!busy) loadDialog();
    }
    listDirty();
  } else if (k === 'chat' || k === 'acc') {
    listDirty();
  } else if (k === 'people') {
    clearTimeout(peopleT);
    peopleT = setTimeout(function () { loadPeople(); }, 400);
  }
}

function listDirty() {
  clearTimeout(listT);
  listT = setTimeout(refreshList, 250);
}

// только список чатов (дешевле, чем /__boot с моделями и статусом)
function refreshList() {
  return api('/__dialogs', { ms: 15000 }).then(function (r) {
    var j = r.json || {};
    if (!j.dialogs) return;
    dialogs = j.dialogs;
    if (cur) {
      var d = null;
      for (var i = 0; i < dialogs.length; i++) if (dialogs[i].id === cur.id) { d = dialogs[i]; break; }
      if (!d) {
        cur = null; curData = null; lastCount = -1;
        $('log').innerHTML = ''; $('title').textContent = 'выберите переписку';
      } else cur = d;
    }
    renderAll();
  });
}

// доехать только новыми сообщениями: ?after=<сколько уже есть>
function loadDelta() {
  if (!cur) return Promise.resolve();
  if (deltaBusy) { deltaAgain = true; return Promise.resolve(); }
  deltaBusy = true;
  var id = cur.id;
  var from = Math.max(0, lastCount);
  return api('/__dialog?id=' + encodeURIComponent(id) + '&after=' + from, { ms: 15000 }).then(function (r) {
    deltaBusy = false;
    var j = r.json || {};
    if (!j.id || !cur || cur.id !== id) return;
    if (typeof j.count !== 'number' || j.count < from) { loadDialog(); return; }
    var add = j.messages || [];
    if (add.length) {
      appendMessages(add);
      if (curData) curData.messages = (curData.messages || []).concat(add);
    }
    lastCount = j.count;
    if (deltaAgain) { deltaAgain = false; loadDelta(); }
  });
}

// ---------- модальные окна ----------
function closeModal() { $('modal').className = ''; $('sheet').innerHTML = ''; }
$('modal').onclick = function (e) { if (e.target === this) closeModal(); };

function mlist(items, onPick) {
  var box = document.createElement('div');
  box.className = 'mlist';
  items.forEach(function (it) {
    var el = document.createElement('div');
    el.className = 'mi';
    el.innerHTML = it.html;
    el.onclick = function () {
      var all = box.querySelectorAll('.mi');
      for (var i = 0; i < all.length; i++) all[i].className = 'mi';
      el.className = 'mi on';
      onPick(it.value);
    };
    box.appendChild(el);
  });
  return box;
}

// новый чат с ботом: выбор модели и пресета
function newAiChat() {
  $('modal').className = 'on';
  var sheet = $('sheet');
  sheet.innerHTML = '<h3>Новый чат с ботом</h3><p class="h">Выберите модель. Присет задаёт размер и шаги картинки.</p>' +
    '<div id="mbody">загружаю список моделей…</div>' +
    '<div class="actions"><button class="btn" id="mcancel" type="button">Отмена</button>' +
    '<button class="btn prim" id="mok" type="button" disabled>Создать</button></div>';
  $('mcancel').onclick = closeModal;

  var chosenModel = '', chosenPreset = '';

  function draw() {
    var body = $('mbody');
    body.innerHTML = '';
    if (!models.length) { body.textContent = 'моделей не найдено'; return; }
    body.appendChild(mlist(models.map(function (m) {
      return { value: m.id, html: '<span class="t">' + esc(m.name) + '<small>' +
        (m.type === 'image' ? 'картинки' : 'текст') + ' · ' + esc(m.sizeText || '') + '</small></span>' };
    }), function (id) {
      chosenModel = id;
      var m = models.filter(function (x) { return x.id === id; })[0];
      var ps = (m && m.presets) || [];
      chosenPreset = ps.length ? ps[0].id : '';
      renderPresets(ps);
      $('mok').disabled = false;
    }));

    // пресеты выбранной модели — чипами под списком
    var old = body.querySelector('.chips');
    if (old) old.parentNode.removeChild(old);
  }

  function renderPresets(ps) {
    var old = $('sheet').querySelector('.chips');
    if (old) old.parentNode.removeChild(old);
    if (!ps.length) return;
    var box = document.createElement('div');
    box.className = 'chips';
    ps.forEach(function (p) {
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'chip' + (p.id === chosenPreset ? ' on' : '');
      c.textContent = p.name;
      c.title = p.width + '×' + p.height + ' · ' + p.steps + ' шагов';
      c.onclick = function () {
        chosenPreset = p.id;
        var all = box.querySelectorAll('.chip');
        for (var i = 0; i < all.length; i++) all[i].className = 'chip';
        c.className = 'chip on';
      };
      box.appendChild(c);
    });
    var ok = $('mok');
    ok.parentNode.parentNode.insertBefore(box, ok.parentNode);
  }

  loadModels().then(draw);

  $('mok').onclick = function () {
    if (!chosenModel) return;
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'создаю…';
    post('/__dialogs', { model: chosenModel, preset: chosenPreset }, 25000).then(function (r) {
      var j = r.json || {};
      if (!r.ok || !j.id) {
        btn.disabled = false;
        btn.textContent = 'Создать';
        toast(j.error || 'не получилось создать чат');
        return;
      }
      var d = { id: j.id, title: j.title, model: j.model, count: 0 };
      dialogs.unshift(d);
      closeModal();
      renderAll();
      open(d);
    });
  };
}

// новый диалог с человеком
function newPmChat() {
  $('modal').className = 'on';
  var sheet = $('sheet');
  sheet.innerHTML = '<h3>Новый диалог</h3><p class="h">Выберите человека. Личную переписку видят только двое.</p>' +
    '<div id="mbody">загружаю список людей…</div>' +
    '<div class="actions"><button class="btn" id="mcancel" type="button">Отмена</button>' +
    '<button class="btn prim" id="mok" type="button" disabled>Открыть</button></div>';
  $('mcancel').onclick = closeModal;

  var chosen = '';
  loadPeople().then(function () {
    var body = $('mbody');
    body.innerHTML = '';
    if (!people.length) { body.textContent = 'пока никого нет'; return; }
    body.appendChild(mlist(people.map(function (p) {
      return { value: p.name, html: '<span class="dot' + (p.online ? ' on' : '') + '"></span>' +
        '<span class="t">' + esc(p.name) + '<small>' + (p.online ? 'на связи' : 'не в сети') + '</small></span>' };
    }), function (name) {
      chosen = name;
      $('mok').disabled = false;
    }));
  });

  $('mok').onclick = function () {
    if (!chosen) return;
    var btn = this;
    btn.disabled = true;
    btn.textContent = 'открываю…';
    post('/__pm/open', { user: chosen }, 15000).then(function (r) {
      var j = r.json || {};
      if (!r.ok || !j.ok) {
        btn.disabled = false; btn.textContent = 'Открыть';
        toast(j.error || 'не получилось открыть переписку');
        return;
      }
      var d = { id: j.id, title: j.title || chosen, kind: 'pm', peer: j.peer || chosen };
      if (!dialogs.some(function (x) { return x.id === d.id; })) dialogs.unshift(d);
      closeModal();
      renderAll();
      open(d);
    });
  };
}

// ---------- настройки бота ----------
var PRESETS = [
  { id: 'draft', name: 'Черновик', w: 240, h: 320, steps: 6 },
  { id: 'portrait', name: 'Портрет', w: 320, h: 480, steps: 10 },
  { id: 'square', name: 'Квадрат', w: 384, h: 384, steps: 10 }
];
var MIN_D = 144, MAX_D = 720, ASPECT_MIN = 0.25, ASPECT_MAX = 4;

function snap(v) { return Math.max(MIN_D, Math.min(MAX_D, Math.round(v / 8) * 8)); }

function modelOf(id) {
  return models.filter(function (m) { return m.id === id; })[0] || null;
}

function openCfg() {
  if (!curData) return;
  var isImg = (modelOf(curData.model) || {}).type === 'image';
  var sheet = $('sheet');
  $('modal').className = 'on';
  if (!isImg) {
    sheet.innerHTML = '<h3>Настройки чата</h3>' +
      '<p class="h">Это текстовая модель — размер картинки не нужен.</p>' +
      '<div class="fld"><label>Температура <b id="tv">' + (curData.temperature || 0.7) + '</b></label>' +
      '<input type="range" id="temp" min="0" max="2" step="0.1" value="' + (curData.temperature || 0.7) + '">' +
      '<div class="ends"><span>0 — строго</span><span>2 — свободно</span></div></div>' +
      '<div class="fld"><label>Длина ответа <b id="mv">' + (curData.maxTokens || 512) + '</b></label>' +
      '<input type="range" id="mtok" min="64" max="4096" step="64" value="' + (curData.maxTokens || 512) + '">' +
      '<div class="ends"><span>64</span><span>4096</span></div></div>' +
      '<div id="sv"></div>' +
      '<div class="actions"><button class="btn" id="mcancel" type="button">Закрыть</button>' +
      '<button class="btn prim" id="msave" type="button">Сохранить</button></div>';
    $('mcancel').onclick = closeModal;
    $('temp').oninput = function () { $('tv').textContent = (+this.value).toFixed(1); };
    $('mtok').oninput = function () { $('mv').textContent = this.value; };
    $('msave').onclick = function () { saveCfg({ temperature: +$('temp').value, maxTokens: +$('mtok').value }); };
    return;
  }

  var w = snap(curData.imgWidth || 320), h = snap(curData.imgHeight || 480);
  if (h > MAX_D) h = MAX_D;
  var ratio = w / h;
  if (ratio < ASPECT_MIN) ratio = ASPECT_MIN;
  if (ratio > ASPECT_MAX) ratio = ASPECT_MAX;

  sheet.innerHTML = '<h3>Настройки бота</h3>' +
    '<p class="h">Размер картинки. Тяните ползунок — вторая сторона подстраивается, чтобы кадр не стал слишком узким.</p>' +
    '<div class="chips" id="pchips"></div>' +
    '<div class="fld"><label>Ширина <b id="wv">' + w + '</b></label>' +
    '<input type="range" id="sw" min="' + MIN_D + '" max="' + MAX_D + '" step="8" value="' + w + '">' +
    '<div class="ends"><span>' + MIN_D + '</span><span>' + MAX_D + '</span></div></div>' +
    '<div class="fld"><label>Высота <b id="hv">' + h + '</b></label>' +
    '<input type="range" id="sh" min="' + MIN_D + '" max="' + MAX_D + '" step="8" value="' + h + '">' +
    '<div class="ends"><span>' + MIN_D + '</span><span>' + MAX_D + '</span></div></div>' +
    '<div class="fld"><label>Шаги <b id="stv">' + (curData.imgSteps || 10) + '</b></label>' +
    '<input type="range" id="st" min="4" max="24" step="1" value="' + (curData.imgSteps || 10) + '">' +
    '<div class="ends"><span>4 — быстро</span><span>24 — качество</span></div></div>' +
    '<div id="sv"></div>' +
    '<div class="actions"><button class="btn" id="mcancel" type="button">Закрыть</button>' +
    '<button class="btn prim" id="msave" type="button">Сохранить</button></div>';

  var chips = $('pchips');
  PRESETS.forEach(function (p) {
    var c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip';
    c.textContent = p.name + ' ' + p.w + '×' + p.h;
    c.onclick = function () {
      w = p.w; h = p.h;
      ratio = w / h;
      $('sw').value = w; $('sh').value = h;
      if ($('st')) $('st').value = p.steps;
      labels();
    };
    chips.appendChild(c);
  });

  function labels() {
    $('wv').textContent = w;
    $('hv').textContent = h;
    $('stv').textContent = $('st').value;
  }

  // связанные ползунки: двигаем одну сторону — вторая подстраивается по соотношению,
  // но и сама упирается в границы, чтобы кадр не стал слишком узким
  $('sw').oninput = function () {
    var want = snap(+this.value);
    var hh = snap(want / ratio);
    var ww = want;
    if (want / ratio > MAX_D) { hh = MAX_D; ww = snap(MAX_D * ratio); }
    else if (want / ratio < MIN_D) { hh = MIN_D; ww = snap(MIN_D * ratio); }
    w = ww; h = hh;
    $('sw').value = ww; $('sh').value = hh;
    labels();
  };
  $('sh').oninput = function () {
    var want = snap(+this.value);
    var ww = snap(want * ratio);
    var hh = want;
    if (want * ratio > MAX_D) { ww = MAX_D; hh = snap(MAX_D / ratio); }
    else if (want * ratio < MIN_D) { ww = MIN_D; hh = snap(MIN_D / ratio); }
    w = ww; h = hh;
    $('sw').value = ww; $('sh').value = hh;
    labels();
  };
  $('st').oninput = labels;
  $('mcancel').onclick = closeModal;
  $('msave').onclick = function () {
    saveCfg({ width: w, height: h, steps: +$('st').value });
  };
}

function saveCfg(extra) {
  var body = Object.assign({ id: cur.id }, extra);
  var btn = $('msave');
  var sv = $('sv');
  if (btn) { btn.disabled = true; btn.textContent = 'сохраняю…'; }
  if (sv) { sv.className = ''; sv.textContent = 'отправляю на сервер…'; }
  post('/__dialog/params', body, 20000).then(function (r) {
    var j = r.json || {};
    if (r.ok && j.ok !== false) {
      if (sv) { sv.className = 'good'; sv.textContent = 'сохранено ✓ действует в этом чате'; }
      if (btn) { btn.textContent = 'Сохранено'; }
      return loadDialog().then(function () {
        setTimeout(function () { if ($('modal').className === 'on') { $('modal').className = ''; } }, 700);
      });
    }
    if (btn) { btn.disabled = false; btn.textContent = 'Сохранить'; }
    if (sv) { sv.className = 'bad'; sv.textContent = j.error || ('не сохранилось (HTTP ' + r.status + ')'); }
  }).catch(function () {
    if (btn) { btn.disabled = false; btn.textContent = 'Сохранить'; }
    if (sv) { sv.className = 'bad'; sv.textContent = 'связь оборвалась — попробуйте ещё раз'; }
  });
}

// ---------- удаление чата ----------
function removeChat(d) {
  if (!confirm('Удалить «' + d.title + '»? Файл уедет в data\\trash на сервере.')) return;
  post('/__dialog/delete', { id: d.id }, 15000).then(function (r) {
    var j = r.json || {};
    if (!r.ok || j.ok === false) { toast(j.error || 'не удалось удалить'); return; }
    toast('удалено');
    if (cur && cur.id === d.id) {
      cur = null; curData = null;
      $('log').innerHTML = '';
      $('title').textContent = 'выберите переписку';
      $('cfg').disabled = true;
    }
    refreshDialogs();
  });
}

// ---------- мелочи ----------
function renderManage() {
  $('acct').onclick = function () { location.href = GH + '/account/'; };
  $('actback').onclick = function () {
    post('/__adm/act', { user: '' }, 10000).then(function () {
      actName = ''; showMe(); refreshDialogs();
      toast('вы снова работаете от своего имени');
    });
  };
  $('menu').onclick = function () { $('side').classList.toggle('hide'); };
  $('form').onsubmit = function (e) { e.preventDefault(); send(); };
  $('text').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $('text').addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, window.innerHeight * 0.4) + 'px';
  });
  $('file').onchange = function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (f) upload(f);
  };
  $('lretry').onclick = function () { hideLogin(); boot(); };
  $('newAI').onclick = function () { newAiChat(); };
  $('newPM').onclick = function () { newPmChat(); };
  $('cfg').onclick = openCfg;
}

// телефон: клавиатура не должна перекрывать ленту и поле ввода
var vv = window.visualViewport;
function fitViewport() {
  if (!vv) return;
  document.documentElement.style.height = Math.round(vv.height) + 'px';
  var log = $('log');
  if (log.scrollHeight - log.scrollTop - log.clientHeight < 160) log.scrollTop = log.scrollHeight;
}
if (vv) { vv.addEventListener('resize', fitViewport); vv.addEventListener('scroll', fitViewport); }

accInit();
boot();
})();
</script>
