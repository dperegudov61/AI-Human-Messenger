<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Вход · AI-чат</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#101317;color:#e3e7ec;font:15px/1.5 -apple-system,'Segoe UI',Roboto,system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:18px;-webkit-text-size-adjust:100%}
.card{width:100%;max-width:390px;background:#181c22;border:1px solid #262c35;border-radius:16px;padding:22px 20px 18px;
  box-shadow:0 18px 50px rgba(0,0,0,.45)}
h1{margin:0 0 2px;font-size:20px;letter-spacing:-.2px}
.sub{color:#7d8794;font-size:13px;margin-bottom:16px}
.st{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#8c96a3;margin-bottom:14px;min-height:18px}
.dot{width:8px;height:8px;border-radius:50%;background:#5a6470;flex:0 0 auto}
.dot.on{background:#3fbf7f;box-shadow:0 0 0 3px rgba(63,191,127,.16)}
.dot.off{background:#c0575f;box-shadow:0 0 0 3px rgba(192,87,95,.16)}
label{display:block;font-size:12.5px;color:#8c96a3;margin:0 0 5px}
input[type=text],input[type=password]{width:100%;padding:12px;margin-bottom:12px;border-radius:11px;border:1px solid #2b323c;
  background:#0d1014;color:#e3e7ec;font:inherit;outline:none}
input[type=text]:focus,input[type=password]:focus{border-color:#4a8fd8}
.rem{display:flex;align-items:center;gap:9px;color:#8c96a3;font-size:13px;margin:0 0 12px;cursor:pointer;user-select:none}
.rem input{width:17px;height:17px;margin:0;accent-color:#3f8ee0}
button{width:100%;padding:13px;border:0;border-radius:11px;background:#2f7fd0;color:#fff;font:inherit;font-weight:600;
  cursor:pointer;transition:background .15s}
button:hover{background:#3a8de0}
button:disabled{opacity:.55;cursor:default}
.err{color:#e88b92;font-size:13px;min-height:20px;margin:10px 0 4px}
.ok{color:#7fd3a5;font-size:13px;min-height:20px;margin:10px 0 4px}
.foot{margin-top:14px;padding-top:13px;border-top:1px solid #222831;color:#69737f;font-size:11.5px;line-height:1.6}
.foot a{color:#8b93a0}
.hint{color:#69737f;font-size:11.5px;margin-top:2px}
</style>
</head>
<body>
<div class="card">
  <h1>AI-чат</h1>
  <div class="sub">Постоянный адрес. Сам чат работает на домашнем ПК.</div>

  <div class="st"><span class="dot" id="dot"></span><span id="stext">проверяю сервер…</span></div>

  <form id="f" autocomplete="on">
    <label for="u">Имя</label>
    <input id="u" type="text" name="username" autocomplete="username" maxlength="24" autocapitalize="none" spellcheck="false">
    <label for="p">Пароль</label>
    <input id="p" type="password" name="password" autocomplete="current-password">
    <label class="rem"><input type="checkbox" id="rm" checked> запомнить это устройство</label>
    <button id="go" type="submit">Войти</button>
  </form>

  <div class="err" id="err"></div>
  <div class="ok" id="okmsg"></div>

  <div class="foot">
    Вход выдаёт владелец сервера — новых пользователей здесь не создают.<br>
    Если сервер выключен, страница об этом скажет: включите окно «2. Сервер» на ПК.<br>
    <a href="#" id="forget" style="display:none">забыть это устройство</a>
  </div>
</div>

<script>
(function(){
'use strict';

// ---------- где искать адрес сервера ----------
var RAW    = 'https://raw.githubusercontent.com/dperegudov61/AI-bot-chat/main/status.json';
var LOCAL  = 'status.json';
var KEY    = 'door.key';

var $ = function(id){ return document.getElementById(id); };
var state = { url:'', online:false };

function setState(cls, text){
  $('dot').className = 'dot' + (cls ? ' ' + cls : '');
  $('stext').textContent = text;
}
function err(t){ $('err').textContent = t || ''; $('okmsg').textContent = ''; }
function ok(t){ $('okmsg').textContent = t || ''; $('err').textContent = ''; }

// ---------- сервисные запросы ----------
function timeout(ms){
  var ctl = new AbortController();
  var t = setTimeout(function(){ ctl.abort(); }, ms);
  return { signal: ctl.signal, done: function(){ clearTimeout(t); } };
}

function fetchJSON(url, opt, ms){
  var tm = timeout(ms || 9000);
  return fetch(url, Object.assign({ cache:'no-store', signal: tm.signal }, opt || {}))
    .then(function(r){ tm.done(); return r.text().then(function(txt){
      var j = {};
      try { j = JSON.parse(txt || '{}'); } catch(e) {}
      return { status:r.status, ok:r.ok, json:j };
    }); })
    .catch(function(){ tm.done(); return { status:0, ok:false, json:{} }; });
}

function getStatus(){
  var bust = '?v=' + Date.now();
  return fetchJSON(RAW + bust, null, 8000).then(function(r){
    if (r.ok && r.json && typeof r.json.url === 'string') return r.json;
    return fetchJSON(LOCAL + bust, null, 6000).then(function(r2){
      return (r2.ok && r2.json && typeof r2.json.url === 'string') ? r2.json : null;
    });
  });
}

function ping(url){
  return fetchJSON(url + '/__door/hi', null, 8000).then(function(r){ return r.ok; });
}

function doorAuth(url, payload){
  return fetchJSON(url + '/__door/auth', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify(payload)
  }, 15000).then(function(r){
    var j = r.json || {};
    return { ok: !!(r.ok && j.ok), error: j.error || '', key: j.key || '', ticket: j.ticket || '', user: j.user || '' };
  });
}

function enter(url, ticket){
  location.replace(url + '/?t=' + encodeURIComponent(ticket));
}

// ---------- проверка сервера и «тихий» вход по ключу ----------
function looksLikeKey(s){ return typeof s === 'string' && s.length >= 40; }

function boot(){
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e) {}
  if (saved && !looksLikeKey(saved)) { try { localStorage.removeItem(KEY); } catch(e){} saved = null; }

  if (saved) {
    $('forget').style.display = 'inline';
    $('f').style.display = 'none';
    setState('', 'вхожу по сохранённому ключу…');
    getStatus().then(function(st){
      if (!st || !st.url) { showForm(); err('адрес сервера не опубликован — включите окно «2. Сервер»'); return; }
      return ping(st.url).then(function(live){
        if (!live) { showForm(); setState('off','сервер не отвечает'); err('ПК сейчас выключен или туннель перезапускается'); return; }
        return doorAuth(st.url, { key: saved }).then(function(res){
          if (res.ok && res.ticket) { enter(st.url, res.ticket); return; }
          try { localStorage.removeItem(KEY); } catch(e) {}
          $('forget').style.display = 'none';
          showForm();
          setState('on', 'сервер на связи');
          if (res.error) err('сохранённый вход больше не действует — введите пароль');
        });
      });
    });
    return;
  }

  getStatus().then(function(st){
    state.url = st && st.url ? st.url : '';
    if (!state.url) { setState('off','адрес сервера не опубликован'); return; }
    return ping(state.url).then(function(live){
      state.online = live;
      setState(live ? 'on' : 'off', live ? 'сервер на связи · можно входить' : 'сервер не отвечает');
    });
  });
}

function showForm(){
  $('f').style.display = 'block';
  setTimeout(function(){ try { $('u').focus(); } catch(e){} }, 60);
}

// ---------- отправка формы ----------
$('f').addEventListener('submit', function(e){
  e.preventDefault();
  var login = $('u').value.trim();
  var pass = $('p').value;
  var remember = !!$('rm').checked;
  err('');

  if (!login) { err('введите имя'); $('u').focus(); return; }
  if (!pass) { err('введите пароль'); $('p').focus(); return; }

  var b = $('go');
  b.disabled = true;
  var was = b.textContent;
  b.textContent = 'Проверяю…';

  function stop(msg){
    b.disabled = false; b.textContent = was;
    if (msg) err(msg);
  }

  // адрес могли сменить — берём самый свежий
  getStatus().then(function(st){
    if (!st || !st.url) { stop('адрес сервера не опубликован — включите окно «2. Сервер»'); return; }
    return ping(st.url).then(function(live){
      if (!live) { setState('off','сервер не отвечает'); stop('сервер не отвечает — проверьте, что он включён'); return; }
      return doorAuth(st.url, { login: login, pass: pass, remember: remember }).then(function(res){
        if (!res.ok || !res.ticket) {
          setState('on','сервер на связи');
          stop(res.error || 'не удалось войти');
          $('p').value = '';
          $('p').focus();
          return;
        }
        if (res.key) { try { localStorage.setItem(KEY, res.key); } catch(e) {} }
        ok('вхожу как ' + (res.user || login) + '…');
        enter(st.url, res.ticket);
      });
    });
  });
});

$('forget').addEventListener('click', function(e){
  e.preventDefault();
  try { localStorage.removeItem(KEY); } catch(e) {}
  $('forget').style.display = 'none';
  $('okmsg').textContent = '';
  showForm();
  err('это устройство больше не помнит вход');
  getStatus().then(function(st){
    if (!st || !st.url) return;
    return ping(st.url).then(function(live){ setState(live ? 'on':'off', live ? 'сервер на связи' : 'сервер не отвечает'); });
  });
});

boot();
})();
</script>
</body>
</html>
